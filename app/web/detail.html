<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问题详情 - AI 问答社区</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* 保持一致的高级 UI 风格 */
        :root { --primary: #2563eb; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #111827; --text-muted: #6b7280; --border-color: #e5e7eb; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; color: var(--text-main); }
        .navbar { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 0 40px; height: 64px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
        .navbar-brand { font-size: 20px; font-weight: 700; color: var(--primary); cursor: pointer; text-decoration: none; }
        .navbar-user { display: flex; align-items: center; gap: 12px; }
        .user-greeting { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .btn-outline {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-outline:hover { background: #f9fafb; border-color: #d1d5db; }

        /* 🌟 修改容器：加宽，并采用 1fr 和 300px 的左右分栏布局 */
        .container {
            max-width: 1100px; /* 原来是800，加宽以容纳侧边栏 */
            margin: 32px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 300px; /* 左侧自适应，右侧固定 300px */
            gap: 24px;
            align-items: start; /* 确保左右两边各自独立滚动 */
        }

        /* 🌟 新增：右侧悬浮面板专属样式 */
        .sidebar-sticky {
            position: sticky;
            top: 88px; /* 距离顶部的距离（避开导航栏） */
        }

        .detail-card { background: var(--card-bg); padding: 32px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; }
        .back-link:hover { text-decoration: underline; }

        .q-title { font-size: 24px; font-weight: 700; margin: 0 0 16px 0; line-height: 1.4; }
        .q-meta { font-size: 14px; color: var(--text-muted); display: flex; gap: 16px; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border-color); }
        .q-content { font-size: 16px; line-height: 1.7; white-space: pre-wrap; color: #374151; min-height: 100px; }

        /* 加载状态的样式 */
        #loading { text-align: center; padding: 40px; color: var(--text-muted); }

        /* 🌟 评论折叠专属样式 */
        .answer-wrapper {
            position: relative;
            max-height: 160px; /* 默认只显示大约 6 行的高度 */
            overflow: hidden;
            transition: max-height 0.3s ease; /* 展开时有一个平滑的动画 */
        }

        .answer-wrapper.expanded {
            max-height: 5000px; /* 展开后解除限制（给个巨大的值配合动画） */
        }

        /* 底部淡出的雾化遮罩层 */
        .fade-mask {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 80px;
            /* 从透明过渡到卡片的底色 #f8fafc */
            background: linear-gradient(to bottom, rgba(248, 250, 252, 0), rgba(248, 250, 252, 1));
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* 展开后，遮罩层变得完全透明 */
        .answer-wrapper.expanded .fade-mask { opacity: 0; }

        /* 展开/收起按钮 */
        .toggle-btn {
            color: var(--primary);
            background: none; border: none; padding: 12px 0 0 0;
            font-size: 14px; font-weight: 600; cursor: pointer; display: inline-block;
        }
        .toggle-btn:hover { text-decoration: underline; }

        /* 🌟 Markdown 富文本专属美化样式 */
        .markdown-content p { margin-bottom: 12px; }
        .markdown-content ul, .markdown-content ol { padding-left: 24px; margin-bottom: 12px; }
        .markdown-content blockquote { border-left: 4px solid #cbd5e1; color: #64748b; padding-left: 12px; margin: 12px 0; background: #f8fafc; padding: 8px 12px; border-radius: 4px; }

        /* 🌟 代码块的黑底框框（VS Code 风格） */
        .markdown-content pre {
            background-color: #282c34 !important; /* 极客黑底 */
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 16px 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .markdown-content code {
            font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
            font-size: 14px;
        }
        /* 🌟 行内小代码块（红字灰底） */
        .markdown-content p code, .markdown-content li code {
            background-color: #f1f5f9;
            color: #e11d48;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/home" class="navbar-brand">💡 AI QA 社区</a>
        <div class="navbar-user">
            <span class="user-greeting" id="detail-user-greeting">正在加载用户信息...</span>
            <button class="btn-outline" onclick="goToProfile()">我的中心</button>
            <button class="btn-outline" onclick="logout()">退出登录</button>
        </div>
    </nav>

    <div class="container">
        <div class="main-content" style="min-width: 0;">
            <a href="/home" class="back-link">← 返回大厅</a>

            <div class="detail-card" id="detail-container">
                <div id="loading">⏳ 正在拼命从数据库里拉取全文...</div>
                </div>
        </div>

        <div class="sidebar-sticky">
            <div class="detail-card" style="padding: 24px;">
                <h3 style="margin-top: 0; margin-bottom: 16px; font-size: 16px; color: #111827;">💡 撰写你的回答</h3>
                <p id="answer-composer-hint" style="margin: 0 0 12px 0; color: #6b7280; font-size: 13px; line-height: 1.5;">当前问题开放回答中，可以继续补充你的思路。</p>

                <textarea id="my-answer-content" rows="6" placeholder="分享你的知识和见解..." style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; resize: vertical; font-size: 14px; font-family: inherit; margin-bottom: 16px; transition: border-color 0.2s;"></textarea>

                <button id="submit-answer-btn" onclick="submitAnswer()" style="width: 100%; padding: 10px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s;">发 布 回 答</button>
            </div>
        </div>
    </div>

    <script>
        const LOGIN_PAGE_URL = '/login';
        let detailOpenedAt = Date.now();
        let browseHistoryRecorded = false;

        function buildApiUrl(path, params = {}) {
            const url = new URL(path, window.location.origin);
            Object.entries(params).forEach(([key, value]) => {
                if (value !== null && value !== undefined && value !== '') {
                    url.searchParams.set(key, String(value));
                }
            });
            return url.toString();
        }

        function clearSession() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_id');
            localStorage.removeItem('username');
            localStorage.removeItem('user_role');
        }

        function redirectToLogin(message) {
            clearSession();
            if (message) {
                alert(message);
            }
            window.location.href = LOGIN_PAGE_URL;
        }

        function logout() {
            redirectToLogin();
        }

        function goToProfile() {
            window.location.href = '/me';
        }

        function getCurrentQuestionId() {
            const urlParams = new URLSearchParams(window.location.search);
            const legacyId = urlParams.get('id');
            if (legacyId) {
                return legacyId;
            }

            const matched = window.location.pathname.match(/^\/questions\/(\d+)\/?$/);
            return matched ? matched[1] : null;
        }

        function getCurrentUserId() {
            const raw = localStorage.getItem('user_id');
            const parsed = raw ? Number(raw) : NaN;
            return Number.isInteger(parsed) && parsed > 0 ? parsed : null;
        }

        function getCurrentUserRole() {
            return localStorage.getItem('user_role') || '';
        }

        function getQuestionStatusMeta(status) {
            switch (status) {
                case 'RESOLVED':
                    return {
                        label: '已解决',
                        style: 'background:#ecfdf5; color:#047857; border:1px solid #a7f3d0;'
                    };
                case 'CLOSED':
                    return {
                        label: '已关闭',
                        style: 'background:#f3f4f6; color:#4b5563; border:1px solid #d1d5db;'
                    };
                case 'ARCHIVED':
                    return {
                        label: '已归档',
                        style: 'background:#fff7ed; color:#c2410c; border:1px solid #fdba74;'
                    };
                default:
                    return {
                        label: '开放中',
                        style: 'background:#dbeafe; color:#1d4ed8; border:1px solid #93c5fd;'
                    };
            }
        }

        function buildQuestionStatusBadge(status) {
            const meta = getQuestionStatusMeta(status);
            return `<span style="${meta.style} padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;">${meta.label}</span>`;
        }

        function getFavoriteButtonMeta(isFavorited) {
            if (isFavorited) {
                return {
                    label: '已收藏',
                    style: 'background:#eff6ff; color:#1d4ed8; border:1px solid #93c5fd;'
                };
            }

            return {
                label: '收藏问题',
                style: 'background:#ffffff; color:#475569; border:1px solid #cbd5e1;'
            };
        }

        function canCurrentUserAccept(question) {
            const currentUserId = getCurrentUserId();
            const currentUserRole = getCurrentUserRole();
            return currentUserId === question.user_id || currentUserRole === 'ADMIN';
        }

        function syncAnswerComposer(question) {
            const textarea = document.getElementById('my-answer-content');
            const submitButton = document.getElementById('submit-answer-btn');
            const hint = document.getElementById('answer-composer-hint');
            if (!textarea || !submitButton || !hint) {
                return;
            }

            const isOpen = question.status === 'OPEN';
            textarea.disabled = !isOpen;
            submitButton.disabled = !isOpen;

            if (isOpen) {
                hint.innerText = '当前问题开放回答中，可以继续补充你的思路。';
                textarea.placeholder = '分享你的知识和见解...';
                submitButton.innerText = '发 布 回 答';
                submitButton.style.opacity = '1';
                submitButton.style.cursor = 'pointer';
                return;
            }

            const lockedMessage = question.status === 'RESOLVED'
                ? '该问题已采纳答案，当前不再接受新回答。'
                : '该问题当前不可继续回答。';
            hint.innerText = lockedMessage;
            textarea.placeholder = lockedMessage;
            textarea.value = '';
            submitButton.innerText = '当前不可回答';
            submitButton.style.opacity = '0.65';
            submitButton.style.cursor = 'not-allowed';
        }

        function setFeedbackButtonState(button, isActive) {
            if (!button) {
                return;
            }

            if (isActive) {
                button.style.borderColor = '#3b82f6';
                button.style.color = '#3b82f6';
                button.style.backgroundColor = '#eff6ff';
            } else {
                button.style.borderColor = '#cbd5e1';
                button.style.color = '#64748b';
                button.style.backgroundColor = 'white';
            }
        }

        function applyFeedbackState(answerId, selectedFeedback) {
            const likeBtn = document.getElementById(`like-btn-${answerId}`);
            const dislikeBtn = document.getElementById(`dislike-btn-${answerId}`);

            setFeedbackButtonState(likeBtn, selectedFeedback === 'Y');
            setFeedbackButtonState(dislikeBtn, selectedFeedback === 'N');
        }

        async function loadQuestionDetail(resetBrowseSession = false) {
            const token = localStorage.getItem('access_token');
            const questionId = getCurrentQuestionId();

            if (!questionId) {
                document.getElementById('detail-container').innerHTML = '<div style="color:red">❌ 找不到帖子 ID</div>';
                return;
            }

            try {
                const response = await fetch(buildApiUrl(`/api/questions/${questionId}`), {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (resetBrowseSession) {
                        detailOpenedAt = Date.now();
                        browseHistoryRecorded = false;
                    }
                    renderDetail(data);
                } else if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                } else {
                    document.getElementById('detail-container').innerHTML = `<div style="color:red">❌ 拉取失败，可能帖子被删了，或者后端没写这个接口 (状态码: ${response.status})</div>`;
                }
            } catch (error) {
                console.error(error);
                document.getElementById('detail-container').innerHTML = '<div style="color:red">❌ 网络错误，后端服务挂了吗？</div>';
            }
        }

        window.onload = async function() {
            const token = localStorage.getItem('access_token');
            const username = localStorage.getItem('username');
            if (!token) {
                alert('请先登录！');
                window.location.href = LOGIN_PAGE_URL;
                return;
            }
            document.getElementById('detail-user-greeting').innerText = username
                ? `欢迎回来, ${username}`
                : '已登录用户';
            await loadQuestionDetail(true);
        };

        function renderDetail(q) {
            const container = document.getElementById('detail-container');
            const date = new Date(q.ask_time).toLocaleString();
            const author = q.username ? q.username : `社区用户 ${q.user_id || '未知'}`;
            const content = q.content ? q.content : '<span style="color:#9ca3af; font-style:italic;">（该用户很高冷，提问时没有填写详细描述）</span>';
            const statusBadge = buildQuestionStatusBadge(q.status);
            const favoriteMeta = getFavoriteButtonMeta(Boolean(q.is_favorited));
            const canAcceptAnswers = canCurrentUserAccept(q);
            const resolutionText = q.accepted_answer_id
                ? '✅ 已采纳最佳答案'
                : (q.status === 'OPEN' ? '🟦 仍在征集回答' : '📌 当前暂无已采纳答案');

            // 🌟 告诉 marked.js：当你遇到代码块时，请叫 highlight.js 来涂色！
            marked.setOptions({
                highlight: function (code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                },
                breaks: true // 允许原生的回车换行
            });

            // 🌟 新增：拼装回答（评论区）的 HTML 🌟
            let answersHtml = '<h3 style="margin-top: 48px; border-bottom: 2px solid #e5e7eb; padding-bottom: 12px; font-size: 18px; color: #111827;">💬 回答区</h3>';

            if (q.answers && q.answers.length > 0) {
                q.answers.forEach(ans => {
                    const ansDate = new Date(ans.generate_time).toLocaleString();
                    const ansId = ans.answer_id; // 拿一个唯一 ID，用来控制开关
                    const acceptedBadge = ans.is_accepted
                        ? '<span style="background:#ecfdf5; color:#047857; border:1px solid #86efac; padding:4px 8px; border-radius:999px; font-size:12px; font-weight:700;">✅ 已采纳答案</span>'
                        : '';
                    const canShowAcceptButton = canAcceptAnswers && ans.answer_type !== 'SYSTEM' && !['CLOSED', 'ARCHIVED'].includes(q.status);
                    const acceptButtonLabel = ans.is_accepted
                        ? '当前已采纳'
                        : (q.accepted_answer_id ? '改为采纳' : '采纳此答案');
                    const acceptButtonDisabled = ans.is_accepted ? 'disabled' : '';
                    const acceptButtonStyle = ans.is_accepted
                        ? 'background:#ecfdf5; color:#047857; border:1px solid #86efac; cursor:not-allowed; opacity:0.9;'
                        : 'background:#f0fdf4; color:#166534; border:1px solid #86efac; cursor:pointer;';
                    const acceptButtonHtml = canShowAcceptButton
                        ? `<button id="accept-btn-${ansId}" onclick="acceptAnswer(${q.question_id}, ${ansId})" ${acceptButtonDisabled} style="${acceptButtonStyle} border-radius: 20px; padding: 6px 16px; font-size: 13px; font-weight: 600; transition: all 0.2s;">${acceptButtonLabel}</button>`
                        : '';
                    const answerCardStyle = ans.is_accepted
                        ? 'background:#f0fdf4; border:1px solid #86efac; box-shadow: 0 1px 2px rgba(0,0,0,0.02);'
                        : 'background:#f8fafc; border:1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.02);';

                    // 🌟 智能判断：是人类还是 AI？
                    let authorName = '';
                    let authorIcon = '';
                    let tagColor = '';

                    // 匹配底层数据库里的 'MANUAL' 类型
                    if (ans.answer_type === 'MANUAL' || !ans.provider_name) {
                        authorName = ans.author_username ? ans.author_username : `社区用户 ${ans.user_id}`;
                        authorIcon = '👤';
                        tagColor = 'background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb;'; // 真人：高级灰
                    } else {
                        authorName = ans.provider_name;
                        authorIcon = '🤖';
                        tagColor = 'background: #dbeafe; color: #1e40af;'; // AI：科技蓝
                    }

                    // 组装带高级样式的 HTML
                    // 组装带高级样式的 HTML
                    // 组装带高级样式的 HTML
                    answersHtml += `
                        <div style="${answerCardStyle} padding: 24px; border-radius: 12px; margin-top: 20px;">

                            <div style="font-size: 14px; color: #475569; margin-bottom: 16px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                    <span style="${tagColor} padding: 4px 8px; border-radius: 6px; font-size: 12px;">${authorIcon} ${authorName}</span>
                                    <span style="font-weight: normal; font-size: 13px; color: #94a3b8;">回答于 ${ansDate}</span>
                                </div>
                                ${acceptedBadge}
                            </div>

                            <div id="wrapper-${ansId}" class="answer-wrapper">
                                <div class="markdown-content" style="font-size: 15px; line-height: 1.8; color: #334155;">
                                    ${marked.parse(ans.content)}
                                </div>
                                <div id="mask-${ansId}" class="fade-mask"></div>
                            </div>

                            <button id="btn-${ansId}" class="toggle-btn" style="margin-bottom: 12px;" onclick="toggleAnswer(${ansId})">阅读全文 ↓</button>

                            <div style="display: flex; gap: 12px; margin-top: 8px; padding-top: 16px; border-top: 1px solid #e2e8f0; flex-wrap: wrap;">
                                <button id="like-btn-${ansId}" onclick="toggleFeedback(${ansId}, 'Y')" style="background: white; border: 1px solid #cbd5e1; border-radius: 20px; padding: 6px 16px; cursor: pointer; color: #64748b; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: all 0.2s;">
                                    👍 <span id="like-count-${ansId}">${ans.like_count || 0}</span>
                                </button>
                                <button id="dislike-btn-${ansId}" onclick="toggleFeedback(${ansId}, 'N')" style="background: white; border: 1px solid #cbd5e1; border-radius: 20px; padding: 6px 16px; cursor: pointer; color: #64748b; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: all 0.2s;">
                                    👎 <span id="dislike-count-${ansId}">${ans.dislike_count || 0}</span>
                                </button>
                                ${acceptButtonHtml}
                            </div>

                        </div>
                    `;
                });
            } else {
                answersHtml += '<div style="color: #9ca3af; margin-top: 32px; font-size: 15px; text-align: center; background: #f9fafb; padding: 32px; border-radius: 12px;">暂时还没有人（或 AI）回答，快来抢沙发吧！</div>';
            }

            container.innerHTML = `
                <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px;">
                    <h1 class="q-title" style="margin-bottom: 0;">${q.title}</h1>
                    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
                        <button onclick="toggleFavorite(${q.question_id}, ${q.is_favorited ? 'true' : 'false'})" style="${favoriteMeta.style} border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s;">${favoriteMeta.label}</button>
                        ${statusBadge}
                    </div>
                </div>
                <div class="q-meta">
                    <span>👤 ${author}</span>
                    <span>⏱ ${date}</span>
                    <span>⭐ ${q.favorite_count || 0} 次收藏</span>
                    <span>💬 ${q.answer_count || 0} 条回答</span>
                    <span>${resolutionText}</span>
                </div>
                <div class="q-content">${content}</div>
                ${answersHtml} `;
            syncAnswerComposer(q);

            // 🌟 智能检测：如果回答本来就很短，就不显示展开按钮了
            if (q.answers && q.answers.length > 0) {
                q.answers.forEach(ans => {
                    const wrapper = document.getElementById(`wrapper-${ans.answer_id}`);
                    const btn = document.getElementById(`btn-${ans.answer_id}`);
                    const mask = document.getElementById(`mask-${ans.answer_id}`);

                    // scrollHeight 是文字的真实高度，如果小于或等于我们设定的 160px，就直接完全展示
                    if (wrapper && wrapper.scrollHeight <= 160) {
                        wrapper.classList.add('expanded');
                        if (btn) btn.style.display = 'none';
                        if (mask) mask.style.display = 'none';
                    }
                });
            }

            // 🌟 在页面 HTML 渲染完毕后，立刻去拉取私人状态！
            const qId = getCurrentQuestionId();
            if (qId) {
                loadMyFeedbacks(qId);
            }
        }

        async function acceptAnswer(questionId, answerId) {
            const token = localStorage.getItem('access_token');

            try {
                const response = await fetch(buildApiUrl(`/api/questions/${questionId}/accept-answer`), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ answer_id: answerId })
                });

                if (response.ok) {
                    const data = await response.json();
                    renderDetail(data);
                    alert('✅ 已更新采纳答案。');
                } else if (response.status === 401) {
                    redirectToLogin('登录状态已失效，请重新登录。');
                } else {
                    const err = await response.json();
                    alert("❌ 采纳失败: " + JSON.stringify(err));
                }
            } catch (error) {
                console.error("采纳答案失败:", error);
                alert("❌ 网络错误，请稍后再试。");
            }
        }

        async function toggleFavorite(questionId, isFavorited) {
            const token = localStorage.getItem('access_token');
            const userId = getCurrentUserId();
            if (!token || !userId) {
                redirectToLogin('请先登录后再执行收藏操作。');
                return;
            }

            try {
                const url = isFavorited
                    ? buildApiUrl(`/api/questions/${questionId}/favorite`, { user_id: userId })
                    : buildApiUrl(`/api/questions/${questionId}/favorite`);
                const response = await fetch(url, {
                    method: isFavorited ? 'DELETE' : 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: isFavorited ? undefined : JSON.stringify({ user_id: userId })
                });

                if (response.ok) {
                    await loadQuestionDetail(false);
                } else if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                } else {
                    const err = await response.json().catch(() => ({}));
                    alert(`❌ 收藏操作失败: ${err.detail || response.status}`);
                }
            } catch (error) {
                console.error("切换收藏失败:", error);
                alert("❌ 网络错误，请稍后再试。");
            }
        }

        // 🌟 展开/收起触发函数
        function toggleAnswer(ansId) {
            const wrapper = document.getElementById(`wrapper-${ansId}`);
            const btn = document.getElementById(`btn-${ansId}`);

            // 如果已经是展开状态，就移除 expanded 类，并改文字为向下箭头
            if (wrapper.classList.contains('expanded')) {
                wrapper.classList.remove('expanded');
                btn.innerText = '阅读全文 ↓';
            } else {
                // 如果是折叠状态，就加上 expanded 类，并改文字为向上箭头
                wrapper.classList.add('expanded');
                btn.innerText = '收起全文 ↑';
            }
        }

        // 🌟 真正提交回答到后端（完美适配原作者接口）
        async function submitAnswer() {
            const content = document.getElementById('my-answer-content').value.trim();
            if (!content) {
                alert("❌ 还没有填写回答内容哦！");
                return;
            }

            const questionId = getCurrentQuestionId();
            const token = localStorage.getItem('access_token');

            // 按钮变灰，防止用户狂点
            const btn = document.querySelector('button[onclick="submitAnswer()"]');
            const originalText = btn.innerText;
            btn.innerText = "发布中...";
            btn.disabled = true;

            try {
                // 拿着房卡去敲原作者真正的大门
                const response = await fetch(buildApiUrl(`/api/questions/${questionId}/answers`), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        content: content
                    })
                });

                if (response.ok) {
                    // 发布成功，直接刷新当前页面！
                    window.location.reload();
                } else if (response.status === 401) {
                    redirectToLogin('登录状态已失效，请重新登录。');
                } else {
                    const errorData = await response.json();
                    alert("❌ 发布失败: " + JSON.stringify(errorData));
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert("❌ 网络错误，请检查后端服务！");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // 🌟 商业级反馈交互：无刷新、带变色动画、局部 DOM 更新
        async function toggleFeedback(answerId, isLike) {
            const token = localStorage.getItem('access_token');
            const likeCountSpan = document.getElementById(`like-count-${answerId}`);
            const dislikeCountSpan = document.getElementById(`dislike-count-${answerId}`);

            try {
                const response = await fetch(buildApiUrl(`/api/answers/${answerId}/feedback`), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ is_like: isLike }) // 'Y' 或 'N'
                });

                if (response.ok) {
                    const data = await response.json();
                    likeCountSpan.innerText = data.like_count ?? 0;
                    dislikeCountSpan.innerText = data.dislike_count ?? 0;
                    applyFeedbackState(answerId, data.is_like);
                } else if (response.status === 401) {
                    redirectToLogin('登录状态已失效，请重新登录。');
                } else {
                    const err = await response.json();
                    alert("❌ 操作失败: " + JSON.stringify(err));
                }
            } catch (error) {
                console.error("网络请求错误:", error);
            }
        }

        // 🌟 页面加载后，自动去后端拉取“我”的私人点赞状态，并给按钮涂上蓝色！
        async function loadMyFeedbacks(questionId) {
            const token = localStorage.getItem('access_token');
            if (!token) return; // 没登录就不拉取了

            try {
                // 去敲我们刚建好的私人通道
                const response = await fetch(buildApiUrl(`/api/questions/${questionId}/feedbacks`), {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const feedbacks = await response.json();
                    // feedbacks 长这样：{ "23": "Y", "25": "N" }

                    // 遍历我的账本，见缝插针地修改颜色
                    for (const [ansId, isLike] of Object.entries(feedbacks)) {
                        applyFeedbackState(ansId, isLike);
                    }
                } else if (response.status === 401) {
                    redirectToLogin('登录状态已失效，请重新登录。');
                }
            } catch (error) {
                console.error("拉取点赞状态失败", error);
            }
        }

        async function recordBrowseHistory(questionId) {
            if (browseHistoryRecorded) {
                return;
            }

            const token = localStorage.getItem('access_token');
            const userId = getCurrentUserId();
            if (!token || !userId || !questionId) {
                return;
            }

            browseHistoryRecorded = true;
            const duration = Math.max(0, Math.round((Date.now() - detailOpenedAt) / 1000));

            try {
                await fetch(buildApiUrl(`/api/questions/${questionId}/browse`), {
                    method: 'POST',
                    keepalive: true,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        duration,
                        click_depth: 1
                    })
                });
            } catch (error) {
                console.error("记录浏览历史失败:", error);
                browseHistoryRecorded = false;
            }
        }

        window.addEventListener('pagehide', () => {
            const questionId = getCurrentQuestionId();
            if (questionId) {
                recordBrowseHistory(questionId);
            }
        });

    </script>
</body>
</html>
