                <p id="answer-composer-hint" class="answer-composer-hint">当前问题开放回答中，可以继续补充你的思路。</p>

                <textarea id="my-answer-content" rows="6" maxlength="10000" placeholder="分享你的知识和见解..." class="answer-textarea" oninput="updateAnswerContentCounter()"></textarea>
                <div id="answer-content-counter" class="char-counter" style="margin-top:-10px; margin-bottom:14px;">0 / 10000</div>

                <div class="media-uploader">
                    <div class="media-uploader-title">
                        <span>回答配图</span>
                        <label class="media-upload-button" for="answer-images">选择图片</label>
                        <input id="answer-images" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="handleAnswerImageSelection(event)" style="display: none;">
                    </div>
                    <p class="media-upload-hint">可选，最多 6 张，发布后会显示在回答正文下方。</p>
                    <div id="answer-image-preview" class="media-preview-grid"></div>
                </div>

                <button id="submit-answer-btn" onclick="submitAnswer()" class="answer-submit">发布回答</button>
            </div>
        </div>
    </div>

    <script>
        const LOGIN_PAGE_URL = '/login';
        const ALLOWED_IMAGE_TYPES = new Set(['image/jpeg', 'image/png', 'image/webp']);
        const MAX_ANSWER_IMAGES = 6;
        const MAX_ANSWER_IMAGE_SIZE = 50 * 1024 * 1024;
        let detailOpenedAt = Date.now();
        let browseHistoryRecorded = false;
        let selectedAnswerImages = [];
        let currentQuestionDetail = null;
        const commentStateByAnswerId = {};
        const followUpStateByAnswerId = {};
        const DEFAULT_VISIBLE_REPLIES = 2;

        function buildApiUrl(path, params = {}) {
            const url = new URL(path, window.location.origin);
            Object.entries(params).forEach(([key, value]) => {
                if (value !== null && value !== undefined && value !== '') {
                    url.searchParams.set(key, String(value));
                }
            });
            return url.toString();
        }

        function extractErrorDetail(data) {
            if (!data) return '';
            if (typeof data.detail === 'string') return data.detail.trim();
            if (typeof data.message === 'string') return data.message.trim();
            if (Array.isArray(data.detail)) {
                return data.detail
                    .map(item => item?.msg || item?.message || '')
                    .filter(Boolean)
                    .join('；');
            }
            return '';
        }

        async function readErrorDetail(response) {
            const data = await response.json().catch(() => ({}));
            return extractErrorDetail(data);
        }

        function getFriendlyDetailError(response, detail, targetName) {
            const text = String(detail || '');
            const limit = targetName === '评论' ? '2000' : '10000';
            if (response.status === 422 || text.includes('String should') || text.includes('字段')) {
                return `${targetName}内容不符合要求，请确认不为空且不超过 ${limit} 字。`;
            }
            if (text.includes('max_length') || text.includes(limit)) {
                return `${targetName}内容不能超过 ${limit} 字，请精简后再发布。`;
            }
            if (response.status >= 500) {
                return '服务暂时异常，请稍后重试或联系管理员。';
            }
            return text || `请求失败（${response.status}）`;
        }

        function updateCharCounter(counter, length, maxLength, label) {
            if (!counter) return;
            counter.classList.remove('warning', 'error');
            if (length >= maxLength) {
                counter.classList.add('error');
            } else if (length >= Math.floor(maxLength * 0.9)) {
                counter.classList.add('warning');
            }
            const extra = length >= maxLength
                ? `，${label}已到上限，不能继续输入。`
                : '';
            counter.textContent = `${length} / ${maxLength}${extra}`;
        }

        function updateAnswerContentCounter() {
            const textarea = document.getElementById('my-answer-content');
            const counter = document.getElementById('answer-content-counter');
            updateCharCounter(counter, textarea?.value.length || 0, 10000, '回答内容');
        }

        function updateCommentContentCounter(textareaId, value) {
            const counter = document.getElementById(`${textareaId}-counter`);
            updateCharCounter(counter, String(value || '').length, 2000, '评论内容');
        }

        function clearSession() {
            sessionStorage.removeItem('access_token');
            sessionStorage.removeItem('user_id');
            sessionStorage.removeItem('username');
            sessionStorage.removeItem('nickname');
            sessionStorage.removeItem('user_role');
        }

        function redirectToLogin(message) {
            clearSession();
            if (message) {
                alert(message);
            }
            window.location.href = LOGIN_PAGE_URL;
        }

        function switchToGuestMode() {
            clearSession();
            renderGuestNav();
        }

        function goToLogin() {
            window.location.href = LOGIN_PAGE_URL;
        }

        function isAuthenticated() {
            return Boolean(sessionStorage.getItem('access_token') && getCurrentUserId());
        }

        function buildAuthHeaders(extraHeaders = {}) {
            const token = sessionStorage.getItem('access_token');
            return token
                ? { ...extraHeaders, 'Authorization': `Bearer ${token}` }
                : { ...extraHeaders };
        }

        function logout() {
            clearSession();
            closeUserMenu();
            renderGuestNav();
            loadQuestionDetail(false);
        }

        function goToProfile() {
            window.location.href = '/me';
        }

        function goToAdmin() {
            window.location.href = '/admin';
        }

        function submitNavSearch() {
            hideNavSearchHistory();
            const keyword = document.getElementById('nav-search-input')?.value.trim();
            const url = new URL('/home', window.location.origin);
            if (keyword) {
                url.searchParams.set('q', keyword);
            } else {
                url.searchParams.set('section', 'hot');
            }
            window.location.href = url.toString();
        }

        async function showNavSearchHistory() {
            const input = document.getElementById('nav-search-input');
            const dropdown = document.getElementById('nav-search-history-dropdown');
            const token = sessionStorage.getItem('access_token');
            if (!input || !dropdown || !token) {
                return;
            }

            input.style.borderColor = 'var(--primary)';
            input.style.boxShadow = '0 0 0 3px rgba(37, 99, 235, 0.1)';
            input.style.background = '#ffffff';

            try {
                const response = await fetch(buildApiUrl('/api/search/history'), {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    renderNavSearchHistory(await response.json());
                } else if (response.status === 401) {
                    redirectToLogin('登录状态已失效，请重新登录。');
                }
            } catch (error) {
                console.error('获取搜索历史失败:', error);
            }
        }

        function renderNavSearchHistory(historyList) {
            const dropdown = document.getElementById('nav-search-history-dropdown');
            if (!dropdown) {
                return;
            }
            dropdown.innerHTML = '';
            if (!Array.isArray(historyList) || historyList.length === 0) {
                dropdown.style.display = 'none';
                return;
            }

            historyList.forEach(keyword => {
                const item = document.createElement('div');
                item.className = 'nav-search-history-item';
                item.innerHTML = '<span style="color:#9ca3af;">🕒</span>';
                const text = document.createElement('span');
                text.textContent = keyword;
                item.appendChild(text);
                item.addEventListener('mousedown', event => {
                    event.preventDefault();
                    applyNavSearchHistory(keyword);
                });
                dropdown.appendChild(item);
            });
            dropdown.style.display = 'block';
        }

        function hideNavSearchHistory() {
            const input = document.getElementById('nav-search-input');
            if (input) {
                input.style.borderColor = 'var(--border-color)';
                input.style.boxShadow = 'none';
                input.style.background = '#f8fafc';
            }
            setTimeout(() => {
                const dropdown = document.getElementById('nav-search-history-dropdown');
                if (dropdown) {
                    dropdown.style.display = 'none';
                }
            }, 150);
        }

        function applyNavSearchHistory(keyword) {
            const input = document.getElementById('nav-search-input');
            if (input) {
                input.value = keyword;
            }
            submitNavSearch();
        }

        function setNavAvatar(displayName, avatarUrl) {
            const avatar = document.getElementById('nav-avatar');
            if (!avatar) {
                return;
            }
            const resolvedUrl = resolvePublicUrl(avatarUrl);
            avatar.innerHTML = '';
            if (resolvedUrl) {
                const img = document.createElement('img');
                img.src = resolvedUrl;
                img.alt = `${displayName} 的头像`;
                avatar.appendChild(img);
                return;
            }
            avatar.textContent = getInitial(displayName);
        }

        function renderGuestNav() {
            const greeting = document.getElementById('detail-user-greeting');
            const loginEntry = document.getElementById('login-entry');
            const menuWrapper = document.getElementById('user-menu-wrapper');
            const adminEntry = document.getElementById('admin-entry');
            if (greeting) {
                greeting.innerText = '游客浏览';
            }
            if (loginEntry) {
                loginEntry.style.display = 'inline-flex';
                loginEntry.style.alignItems = 'center';
            }
            if (menuWrapper) {
                menuWrapper.style.display = 'none';
            }
            if (adminEntry) {
                adminEntry.style.display = 'none';
            }
        }

        function renderAuthenticatedNav(displayName, role = '') {
            const greeting = document.getElementById('detail-user-greeting');
            const loginEntry = document.getElementById('login-entry');
            const menuWrapper = document.getElementById('user-menu-wrapper');
            const adminEntry = document.getElementById('admin-entry');
            if (greeting) {
                greeting.innerText = `欢迎回来, ${displayName || '同学'}`;
            }
            if (loginEntry) {
                loginEntry.style.display = 'none';
            }
            if (menuWrapper) {
                menuWrapper.style.display = 'block';
            }
            if (adminEntry) {
                adminEntry.style.display = role === 'ADMIN' ? 'flex' : 'none';
            }
        }

        function closeUserMenu() {
            const panel = document.getElementById('user-menu-panel');
            const trigger = document.getElementById('user-menu-trigger');
            if (panel) {
                panel.classList.remove('open');
            }
            if (trigger) {
                trigger.setAttribute('aria-expanded', 'false');
            }
        }

        function toggleUserMenu(event) {
            event.stopPropagation();
            const panel = document.getElementById('user-menu-panel');
            const trigger = document.getElementById('user-menu-trigger');
            if (!panel || !trigger) {
                return;
            }
            const willOpen = !panel.classList.contains('open');
            panel.classList.toggle('open', willOpen);
            trigger.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        }

        async function loadCurrentUserProfileForNav() {
            const token = sessionStorage.getItem('access_token');
            if (!token) {
                renderGuestNav();
                return;
            }
            try {
                const response = await fetch(buildApiUrl('/api/users/me/profile'), {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) {
                    if ([401, 403, 423].includes(response.status)) {
                        switchToGuestMode();
                    }
                    return;
                }
                const profile = await response.json();
                const displayName = profile.nickname || profile.username || sessionStorage.getItem('username') || '同学';
                renderAuthenticatedNav(displayName, profile.role || sessionStorage.getItem('user_role') || '');
                setNavAvatar(displayName, profile.avatar_url);
                sessionStorage.setItem('username', profile.username || '');
                sessionStorage.setItem('nickname', profile.nickname || '');
            } catch (error) {
                console.error('加载导航用户信息失败:', error);
            }
        }

        function getCurrentQuestionId() {
            const urlParams = new URLSearchParams(window.location.search);
            const legacyId = urlParams.get('id');
            if (legacyId) {
                return legacyId;
            }

            const matched = window.location.pathname.match(/^\/questions\/(\d+)\/?$/);
            return matched ? matched[1] : null;
        }

        function getCurrentUserId() {
            const raw = sessionStorage.getItem('user_id');
            const parsed = raw ? Number(raw) : NaN;
            return Number.isInteger(parsed) && parsed > 0 ? parsed : null;
        }

        function getCurrentUserRole() {
            return sessionStorage.getItem('user_role') || '';
        }

        function getQuestionStatusMeta(status) {
            switch (status) {
                case 'RESOLVED':
                    return {
                        label: '已解决',
                        style: 'background:#ecfdf5; color:#047857; border:1px solid #a7f3d0;'
                    };
                case 'CLOSED':
                    return {
                        label: '已关闭',
                        style: 'background:#f3f4f6; color:#4b5563; border:1px solid #d1d5db;'
                    };
                case 'ARCHIVED':
                    return {
                        label: '已归档',
                        style: 'background:#fff7ed; color:#c2410c; border:1px solid #fdba74;'
                    };
                default:
                    return {
                        label: '开放中',
                        style: 'background:#dbeafe; color:#1d4ed8; border:1px solid #93c5fd;'
                    };
            }
        }

        function buildQuestionStatusBadge(status) {
            const meta = getQuestionStatusMeta(status);
            return `<span style="${meta.style} padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;">${meta.label}</span>`;
        }

        function getFavoriteButtonMeta(isFavorited) {
            if (isFavorited) {
                return {
                    label: '已收藏',
                    style: 'background:#eff6ff; color:#1d4ed8; border:1px solid #93c5fd;'
                };
            }

            return {
                label: '收藏问题',
                style: 'background:#ffffff; color:#475569; border:1px solid #cbd5e1;'
            };
        }

        function canCurrentUserAccept(question) {
            const currentUserId = getCurrentUserId();
            const currentUserRole = getCurrentUserRole();
            return currentUserId === question.user_id || currentUserRole === 'ADMIN';
        }

        function syncAnswerComposer(question) {
            const textarea = document.getElementById('my-answer-content');
            const submitButton = document.getElementById('submit-answer-btn');
            const hint = document.getElementById('answer-composer-hint');
            if (!textarea || !submitButton || !hint) {
                return;
            }

            const isOpen = question.status === 'OPEN';
            const loggedIn = isAuthenticated();
            textarea.disabled = !isOpen || !loggedIn;
            submitButton.disabled = !isOpen;
            const imageInput = document.getElementById('answer-images');
            const imageLabel = document.querySelector('label[for="answer-images"]');
            if (imageInput) {
                imageInput.disabled = !isOpen || !loggedIn;
            }
            if (imageLabel) {
                imageLabel.style.opacity = isOpen && loggedIn ? '1' : '0.55';
                imageLabel.style.pointerEvents = isOpen && loggedIn ? 'auto' : 'none';
            }

            if (isOpen) {
                hint.innerText = loggedIn
                    ? '当前问题开放回答中，可以继续补充你的思路。'
                    : '登录后可以发布回答、上传配图并参与互动。';
                textarea.placeholder = loggedIn ? '分享你的知识和见解...' : '请先登录后再撰写回答。';
                submitButton.innerText = loggedIn ? '发 布 回 答' : '登录后回答';
                submitButton.style.opacity = '1';
                submitButton.style.cursor = 'pointer';
                updateAnswerContentCounter();
                return;
            }

            const lockedMessage = question.status === 'RESOLVED'
                ? '该问题已采纳答案，当前不再接受新回答。'
                : '该问题当前不可继续回答。';
            hint.innerText = lockedMessage;
            textarea.placeholder = lockedMessage;
            textarea.value = '';
            updateAnswerContentCounter();
            submitButton.innerText = '当前不可回答';
            submitButton.style.opacity = '0.65';
            submitButton.style.cursor = 'not-allowed';
            resetAnswerImageSelection();
        }

        function formatFileSize(bytes) {
            if (bytes < 1024 * 1024) {
                return `${Math.max(1, Math.round(bytes / 1024))}KB`;
            }
            return `${(bytes / 1024 / 1024).toFixed(1)}MB`;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeAttr(value) {
            return escapeHtml(value);
        }

        function renderPlainText(value) {
            return escapeHtml(value).replace(/\n/g, '<br>');
        }

        let markedConfigured = false;

        function configureMarked() {
            if (markedConfigured || typeof marked === 'undefined') {
                return;
            }
            marked.setOptions({
                highlight: function (code, lang) {
                    if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    if (typeof hljs !== 'undefined') {
                        return hljs.highlightAuto(code).value;
                    }
                    return escapeHtml(code);
                },
                breaks: true
            });
            markedConfigured = true;
        }

        function sanitizeRenderedHtml(html) {
            const template = document.createElement('template');
            template.innerHTML = String(html || '');
            const allowedTags = new Set([
                'A', 'BLOCKQUOTE', 'BR', 'CODE', 'DEL', 'EM', 'H1', 'H2', 'H3',
                'H4', 'H5', 'H6', 'HR', 'LI', 'OL', 'P', 'PRE', 'SPAN',
                'STRONG', 'TABLE', 'TBODY', 'TD', 'TH', 'THEAD', 'TR', 'UL'
            ]);
            const allowedAttrs = {
                A: new Set(['href', 'title', 'target', 'rel']),
                CODE: new Set(['class']),
                PRE: new Set(['class']),
                SPAN: new Set(['class'])
            };
            const safeUrlPattern = /^(https?:|mailto:|tel:|#|\/)/i;

            function cleanNode(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    return;
                }
                if (node.nodeType !== Node.ELEMENT_NODE) {
                    node.remove();
                    return;
                }

                const tagName = node.tagName;
                if (!allowedTags.has(tagName)) {
                    const textNode = document.createTextNode(node.textContent || '');
                    node.replaceWith(textNode);
                    return;
                }

                [...node.attributes].forEach(attr => {
                    const attrName = attr.name.toLowerCase();
                    const tagAllowedAttrs = allowedAttrs[tagName] || new Set();
                    if (!tagAllowedAttrs.has(attrName)) {
                        node.removeAttribute(attr.name);
                        return;
                    }

                    if (attrName === 'href' && !safeUrlPattern.test(attr.value.trim())) {
                        node.removeAttribute(attr.name);
                    }
                    if (attrName === 'class' && !/^[a-z0-9_\-\s]+$/i.test(attr.value)) {
                        node.removeAttribute(attr.name);
                    }
                });

                if (tagName === 'A' && node.getAttribute('href')) {
                    node.setAttribute('target', '_blank');
                    node.setAttribute('rel', 'noopener noreferrer');
                }

                [...node.childNodes].forEach(cleanNode);
            }

            [...template.content.childNodes].forEach(cleanNode);
            return template.innerHTML;
        }

        function renderMarkdown(content) {
            configureMarked();
            if (typeof marked === 'undefined') {
                return renderPlainText(content);
            }
            return sanitizeRenderedHtml(marked.parse(String(content || '')));
        }

        function resolvePublicUrl(url) {
            if (!url) {
                return '';
            }
            if (/^(https?:|data:|blob:)/i.test(url)) {
                return url;
            }
            return new URL(url, window.location.origin).toString();
        }

        function getInitial(name) {
            return String(name || '我').trim().slice(0, 1).toUpperCase() || '我';
        }

        function renderMiniAvatar(name, avatarUrl, fallbackText = '') {
            const resolvedUrl = resolvePublicUrl(avatarUrl);
            const isAi = fallbackText === 'AI';
            if (resolvedUrl) {
                return `<span class="mini-avatar"><img src="${escapeAttr(resolvedUrl)}" alt="${escapeAttr(name)} 的头像"></span>`;
            }
            return `<span class="mini-avatar${isAi ? ' ai' : ''}">${escapeHtml(fallbackText || getInitial(name))}</span>`;
        }

        function renderAuthorMeta(name, avatarUrl, fallbackText = '') {
            return `
                <span class="author-meta">
                    ${renderMiniAvatar(name, avatarUrl, fallbackText)}
                    <span>${escapeHtml(name)}</span>
                </span>
            `;
        }

        function resolveMediaUrl(item) {
            const rawUrl = item?.public_url || item?.url || '';
            if (!rawUrl) {
                return '';
            }
            return new URL(rawUrl, window.location.origin).toString();
        }

        function renderMediaGrid(images, labelPrefix, options = {}) {
            if (!Array.isArray(images) || images.length === 0) {
                return '';
            }
            const {
                canDelete = false,
                ownerType = '',
                ownerId = null,
            } = options;

            const imageItems = images
                .map((item, index) => {
                    const src = resolveMediaUrl(item);
                    const mediaId = Number(item?.media_id || 0);
                    if (!src) {
                        return '';
                    }
                    const deleteButton = canDelete && mediaId && ownerType && ownerId
                        ? `<button
                                type="button"
                                class="media-delete-button"
                                onclick="deleteMediaImage(event, '${escapeAttr(ownerType)}', ${Number(ownerId)}, ${mediaId})"
                            >删除</button>`
                        : '';
                    return `
                        <div class="media-grid-item">
                            <img
                                src="${escapeAttr(src)}"
                                alt="${escapeAttr(labelPrefix)} ${index + 1}"
                                onclick="window.open('${escapeAttr(src)}', '_blank')"
                                loading="lazy"
                            >
                            ${deleteButton}
                        </div>
                    `;
                })
                .join('');

            return imageItems ? `<div class="media-grid">${imageItems}</div>` : '';
        }

        async function deleteMediaImage(event, ownerType, ownerId, mediaId) {
            event?.stopPropagation();
            if (!ownerType || !ownerId || !mediaId) {
                return;
            }
            if (!window.confirm('确认删除这张图片吗？删除后将不再展示。')) {
                return;
            }

            const token = sessionStorage.getItem('access_token');
            const endpoint = ownerType === 'question'
                ? `/api/questions/${ownerId}/images/${mediaId}`
                : `/api/answers/${ownerId}/images/${mediaId}`;

            try {
                const response = await fetch(buildApiUrl(endpoint), {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    await loadQuestionDetail(false);
                } else if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                } else {
                    const err = await response.json().catch(() => ({}));
                    alert(`删除图片失败：${err.detail || response.status}`);
                }
            } catch (error) {
                console.error('删除图片失败:', error);
                alert('网络错误，暂时无法删除图片。');
            }
        }

        async function fetchMediaItems(endpoint) {
            try {
                const token = sessionStorage.getItem('access_token');
                const response = await fetch(buildApiUrl(endpoint), {
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                if (!response.ok) {
                    return null;
                }
                const data = await response.json();
                return Array.isArray(data.items) ? data.items : null;
            } catch (error) {
                console.error('加载图片列表失败:', error);
                return null;
            }
        }

        async function hydrateQuestionImages(question) {
            if (!question?.question_id) {
                return question;
            }
            const questionImages = await fetchMediaItems(`/api/questions/${question.question_id}/images`);
            if (Array.isArray(questionImages)) {
                question.images = questionImages;
            }

            const answers = Array.isArray(question.answers) ? question.answers : [];
            await Promise.all(answers.map(async answer => {
                if (!answer?.answer_id) {
                    return;
                }
                const answerImages = await fetchMediaItems(`/api/answers/${answer.answer_id}/images`);
                if (Array.isArray(answerImages)) {
                    answer.images = answerImages;
                }
            }));

            return question;
        }

        function revokePreviewImages(items) {
            items.forEach(item => URL.revokeObjectURL(item.previewUrl));
        }

        function buildSelectedImageItems(files, maxCount, maxSize) {
            const selected = [];
            const errors = [];

            files.slice(0, maxCount).forEach(file => {
                if (!ALLOWED_IMAGE_TYPES.has(file.type)) {
                    errors.push(`${file.name} 不是支持的图片格式`);
                    return;
                }
                if (file.size > maxSize) {
                    errors.push(`${file.name} 超过 ${formatFileSize(maxSize)}`);
                    return;
                }
                selected.push({
                    file,
                    previewUrl: URL.createObjectURL(file),
                });
            });

            if (files.length > maxCount) {
                errors.push(`本次最多只能选择 ${maxCount} 张图片，已自动忽略多余图片`);
            }

            return { selected, errors };
        }

        function handleAnswerImageSelection(event) {
            if (!isAuthenticated()) {
                event.target.value = '';
                redirectToLogin('请先登录后再上传回答配图。');
                return;
            }
            const files = Array.from(event.target.files || []);
            const { selected, errors } = buildSelectedImageItems(
                files,
                MAX_ANSWER_IMAGES,
                MAX_ANSWER_IMAGE_SIZE
            );

            revokePreviewImages(selectedAnswerImages);
            selectedAnswerImages = selected;
            renderAnswerImagePreview();

            if (errors.length > 0) {
                alert(`部分图片未加入：\n${errors.join('\n')}`);
            }
        }

        function renderAnswerImagePreview() {
            const container = document.getElementById('answer-image-preview');
            if (!container) {
                return;
            }

            if (selectedAnswerImages.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = selectedAnswerImages.map((item, index) => `
                <div class="media-preview-item">
                    <img src="${item.previewUrl}" alt="回答配图预览 ${index + 1}">
                    <button type="button" class="media-preview-remove" onclick="removeAnswerImage(${index})">×</button>
                </div>
            `).join('');
        }

        function removeAnswerImage(index) {
            const [removed] = selectedAnswerImages.splice(index, 1);
            if (removed) {
                URL.revokeObjectURL(removed.previewUrl);
            }
            const input = document.getElementById('answer-images');
            if (input) {
                input.value = '';
            }
            renderAnswerImagePreview();
        }

        function resetAnswerImageSelection() {
            revokePreviewImages(selectedAnswerImages);
            selectedAnswerImages = [];
            const input = document.getElementById('answer-images');
            if (input) {
                input.value = '';
            }
            renderAnswerImagePreview();
        }

        async function uploadAnswerImages(answerId, images, token, onProgress) {
            for (let index = 0; index < images.length; index += 1) {
                const item = images[index];
                const formData = new FormData();
                formData.append('file', item.file);

                const response = await fetch(buildApiUrl(`/api/answers/${answerId}/images`), {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || `${item.file.name} 上传失败`);
                }

                if (typeof onProgress === 'function') {
                    onProgress(index + 1, images.length);
                }
            }
        }

        function findCreatedAnswerId(questionData, content) {
            const currentUserId = getCurrentUserId();
            const answers = Array.isArray(questionData?.answers) ? questionData.answers : [];
            const matchedAnswers = answers
                .filter(answer =>
                    answer.answer_type === 'MANUAL'
                    && answer.user_id === currentUserId
                    && answer.content === content
                )
                .sort((a, b) => new Date(b.generate_time) - new Date(a.generate_time));

            return matchedAnswers.length > 0 ? matchedAnswers[0].answer_id : null;
        }

        function setFeedbackButtonState(button, isActive) {
            if (!button) {
                return;
            }

            if (isActive) {
                button.style.borderColor = '#3b82f6';
                button.style.color = '#3b82f6';
                button.style.backgroundColor = '#eff6ff';
            } else {
                button.style.borderColor = '#cbd5e1';
                button.style.color = '#64748b';
                button.style.backgroundColor = 'white';
            }
        }

        function applyFeedbackState(answerId, selectedFeedback) {
            const likeBtn = document.getElementById(`like-btn-${answerId}`);
            const dislikeBtn = document.getElementById(`dislike-btn-${answerId}`);

            setFeedbackButtonState(likeBtn, selectedFeedback === 'Y');
            setFeedbackButtonState(dislikeBtn, selectedFeedback === 'N');
        }

        function canCommentOnQuestion(question) {
            return Boolean(question) && ['OPEN', 'RESOLVED'].includes(question.status);
        }

        function canCurrentUserUseAiFollowUp(question = currentQuestionDetail) {
            return Boolean(question)
                && question.status !== 'DELETED'
                && getCurrentUserId() === Number(question.user_id);
        }

        function canCurrentUserDeleteAnswer(answer, question = currentQuestionDetail) {
            if (!answer || !question || question.status === 'DELETED' || answer.is_accepted) {
                return false;
            }
            const currentUserId = getCurrentUserId();
            if (!currentUserId) {
                return false;
            }
            if (String(getCurrentUserRole()).toUpperCase() === 'ADMIN') {
                return true;
            }
            return Number(answer.user_id) === currentUserId
                && (answer.answer_type === 'MANUAL' || !answer.provider_name);
        }

        function formatDateTime(value) {
            return value ? new Date(value).toLocaleString() : '';
        }

        function countComments(items) {
            return (items || []).reduce((total, item) => total + 1 + countComments(item.children || []), 0);
        }

        function getDisplayName(username, nickname, fallbackUserId) {
            return nickname || username || `社区用户 ${fallbackUserId ?? '未知'}`;
        }

        function getCommentState(answerId) {
            if (!commentStateByAnswerId[answerId]) {
                commentStateByAnswerId[answerId] = {
                    visible: false,
                    loading: false,
                    loaded: false,
                    total: 0,
                    items: [],
                    showComposer: false,
                    draft: '',
                    activeReplyCommentId: null,
                    replyDrafts: {},
                    expandedThreads: {},
                    hiddenThreads: {},
                    highlightCommentId: null,
                    submittingTarget: null,
                };
            }

            return commentStateByAnswerId[answerId];
        }

        function focusElementSoon(elementId) {
            window.setTimeout(() => {
                const element = document.getElementById(elementId);
                if (element) {
                    element.focus();
                    if (typeof element.selectionStart === 'number') {
                        element.selectionStart = element.selectionEnd = element.value.length;
                    }
                }
            }, 0);
        }

        function scheduleCommentHighlightClear(answerId, commentId) {
            window.setTimeout(() => {
                const state = getCommentState(answerId);
                if (state.highlightCommentId === commentId) {
                    state.highlightCommentId = null;
                    renderComments(answerId);
                }
            }, 2400);
        }

        function updateCommentDraft(answerId, value) {
            const state = getCommentState(answerId);
            state.draft = value;
            updateCommentContentCounter(`comment-textarea-${answerId}`, value);
        }

        function updateReplyDraft(answerId, commentId, value) {
            const state = getCommentState(answerId);
            state.replyDrafts[commentId] = value;
            updateCommentContentCounter(`reply-textarea-${answerId}-${commentId}`, value);
        }

        function toggleReplyThread(answerId, commentId) {
            const state = getCommentState(answerId);
            state.expandedThreads[commentId] = !state.expandedThreads[commentId];
            renderComments(answerId);
        }

        function toggleReplyVisibility(answerId, commentId) {
            const state = getCommentState(answerId);
            state.hiddenThreads[commentId] = !state.hiddenThreads[commentId];
            renderComments(answerId);
        }

        function updateCommentToolbar(answerId) {
            const state = getCommentState(answerId);
            const counter = document.getElementById(`comment-count-${answerId}`);
            const hint = document.getElementById(`comment-toolbar-hint-${answerId}`);
            const toggleBtn = document.getElementById(`toggle-comments-btn-${answerId}`);
            const createBtn = document.getElementById(`open-comment-btn-${answerId}`);
            const canComment = canCommentOnQuestion(currentQuestionDetail);

            if (counter) {
                counter.innerText = state.loaded ? `${state.total} 条评论` : '评论区';
            }

            if (hint) {
                if (state.loading) {
                    hint.innerText = '评论加载中...';
                } else if (!canComment) {
                    hint.innerText = '当前问题不再接受新评论，但仍可查看已有讨论。';
                } else if (state.loaded && state.total > 0) {
                    hint.innerText = '围绕这条回答继续交流，也可以直接回复他人的评论。';
                } else {
                    hint.innerText = '还没有评论，来发表第一条看法吧。';
                }
            }

            if (toggleBtn) {
                toggleBtn.innerText = state.visible ? '收起评论' : '展开评论';
            }

            if (createBtn) {
                createBtn.disabled = !canComment;
                createBtn.innerText = canComment ? '发表评论' : '当前不可评论';
            }
        }

        function renderCommentComposer(answerId, options = {}) {
            const {
                parentCommentId = null,
                title = '发表评论',
                placeholder = '写下你的看法，帮助更多同学理解这条回答...',
            } = options;
            const state = getCommentState(answerId);
            const draft = parentCommentId === null
                ? state.draft
                : (state.replyDrafts[parentCommentId] || '');
            const submitTarget = parentCommentId === null ? 'root' : String(parentCommentId);
            const isSubmitting = state.submittingTarget === submitTarget;
            const textareaId = parentCommentId === null
                ? `comment-textarea-${answerId}`
                : `reply-textarea-${answerId}-${parentCommentId}`;
            const draftLength = draft.length;
            const counterClass = draftLength >= 2000
                ? 'char-counter error'
                : (draftLength >= 1800 ? 'char-counter warning' : 'char-counter');
            const counterText = `${draftLength} / 2000${draftLength >= 2000 ? '，评论内容已到上限，不能继续输入。' : ''}`;
            const onInputCall = parentCommentId === null
                ? `updateCommentDraft(${answerId}, this.value)`
                : `updateReplyDraft(${answerId}, ${parentCommentId}, this.value)`;
            const submitCall = parentCommentId === null
                ? `submitComment(${answerId})`
                : `submitComment(${answerId}, ${parentCommentId})`;
            const cancelCall = parentCommentId === null
                ? `cancelCommentComposer(${answerId})`
                : `cancelReplyComposer(${answerId}, ${parentCommentId})`;

            return `
                <div class="comment-composer">
                    <p class="comment-composer-title">${escapeHtml(title)}</p>
                    <textarea id="${textareaId}" class="comment-textarea" maxlength="2000" placeholder="${escapeAttr(placeholder)}" oninput="${onInputCall}">${escapeHtml(draft)}</textarea>
                    <div id="${textareaId}-counter" class="${counterClass}">${counterText}</div>
                    <div class="comment-composer-footer">
                        <span class="comment-composer-hint">支持换行，发布后会立即出现在当前回答下。</span>
                        <div class="comment-composer-actions">
                            <button type="button" class="comment-btn subtle" onclick="${cancelCall}">取消</button>
                            <button type="button" class="comment-btn primary" onclick="${submitCall}" ${isSubmitting ? 'disabled' : ''}>${isSubmitting ? '发布中...' : (parentCommentId === null ? '发布评论' : '发布回复')}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCommentItem(answerId, comment, depth = 0) {
            const state = getCommentState(answerId);
            const canComment = canCommentOnQuestion(currentQuestionDetail);
            const currentUserId = getCurrentUserId();
            const authorDisplay = getDisplayName(
                comment.author_username,
                comment.author_nickname,
                comment.user_id
            );
            const authorAvatarHtml = renderMiniAvatar(authorDisplay, comment.author_avatar_url);
            const replyTargetName = getDisplayName(
                comment.reply_to_username,
                comment.reply_to_nickname,
                comment.reply_to_user_id
            );
            const isReply = comment.parent_comment_id !== null;
            const showReplyAction = canComment && comment.status === 'ACTIVE';
            const showDeleteAction = currentUserId === comment.user_id && comment.status !== 'DELETED';
            const showReplyComposer = state.activeReplyCommentId === comment.comment_id;
            const children = Array.isArray(comment.children) ? comment.children : [];
            const repliesHidden = children.length > 0
                ? state.hiddenThreads[comment.comment_id] !== false
                : false;
            const expanded = Boolean(state.expandedThreads[comment.comment_id]);
            const visibleChildren = repliesHidden
                ? []
                : (expanded ? children : children.slice(0, DEFAULT_VISIBLE_REPLIES));
            const hiddenChildCount = Math.max(0, children.length - visibleChildren.length);
            const indent = Math.min(depth, 3) * 18;
            const statusClass = String(comment.status || '').toLowerCase();
            const highlightClass = state.highlightCommentId === comment.comment_id ? ' highlighted' : '';
            const deletedOrHiddenClass = statusClass === 'deleted' || statusClass === 'hidden'
                ? ` ${statusClass}`
                : '';
            const statusLabel = comment.status === 'HIDDEN'
                ? '已隐藏'
                : (comment.status === 'DELETED' ? '已删除' : '正常');
            const replyPrefix = isReply
                ? `<span class="comment-reply-target">回复 @${escapeHtml(replyTargetName)}：</span>`
                : '';

            return `
                <div class="comment-item ${isReply ? 'reply' : ''}${highlightClass}${deletedOrHiddenClass}" style="margin-left:${indent}px;">
                    <div class="comment-header">
                        <div class="comment-author-line">
                            ${authorAvatarHtml}
                            <span class="comment-author">${escapeHtml(authorDisplay)}</span>
                            <span class="comment-time">${formatDateTime(comment.create_time)}</span>
                            <span class="comment-status-badge ${statusClass === 'active' ? 'active' : statusClass}">${statusLabel}</span>
                        </div>
                    </div>

                    <div class="comment-content">${replyPrefix}${escapeHtml(comment.content)}</div>

                    <div class="comment-actions">
                        ${showReplyAction ? `<button type="button" class="comment-action-link" onclick="toggleReplyComposer(${answerId}, ${comment.comment_id})">${showReplyComposer ? '收起回复框' : '回复'}</button>` : ''}
                        ${showDeleteAction ? `<button type="button" class="comment-action-link danger" onclick="deleteComment(${answerId}, ${comment.comment_id})">删除</button>` : ''}
                        ${children.length > 0 ? `<button type="button" class="comment-action-link muted" onclick="toggleReplyVisibility(${answerId}, ${comment.comment_id})">${repliesHidden ? `展开回复（${children.length}）` : '折叠回复'}</button>` : ''}
                        ${children.length > DEFAULT_VISIBLE_REPLIES && !repliesHidden ? `<button type="button" class="comment-action-link muted" onclick="toggleReplyThread(${answerId}, ${comment.comment_id})">${expanded ? '收起部分回复' : `展开另外 ${hiddenChildCount} 条回复`}</button>` : ''}
                        ${children.length > 0 ? `<span class="comment-composer-hint">共 ${children.length} 条回复</span>` : ''}
                    </div>

                    ${showReplyComposer ? renderCommentComposer(answerId, {
                        parentCommentId: comment.comment_id,
                        title: `回复 ${authorDisplay}`,
                        placeholder: `回复 @${authorDisplay}...`,
                    }) : ''}

                    ${visibleChildren.length > 0 ? `
                        <div class="comment-children">
                            ${visibleChildren.map(child => renderCommentItem(answerId, child, depth + 1)).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderComments(answerId) {
            const panel = document.getElementById(`comments-panel-${answerId}`);
            if (!panel) {
                return;
            }

            const state = getCommentState(answerId);
            updateCommentToolbar(answerId);

            if (!state.visible) {
                panel.style.display = 'none';
                panel.innerHTML = '';
                return;
            }

            panel.style.display = 'block';

            if (state.loading) {
                panel.className = 'comment-panel loading';
                panel.innerHTML = '评论加载中，请稍候...';
                return;
            }

            panel.className = 'comment-panel';

            const listHtml = state.items.length > 0
                ? `<div class="comment-list">${state.items.map(item => renderCommentItem(answerId, item, 0)).join('')}</div>`
                : '<div class="comment-empty">还没有评论，来发表第一条看法吧。</div>';
            const composerHtml = state.showComposer
                ? renderCommentComposer(answerId)
                : '';

            panel.innerHTML = `
                ${composerHtml}
                ${listHtml}
            `;
        }

        async function loadComments(answerId, options = {}) {
            const state = getCommentState(answerId);
            if (state.loading) {
                return;
            }

            state.loading = true;
            renderComments(answerId);

            try {
                const response = await fetch(buildApiUrl(`/api/answers/${answerId}/comments`), {
                    method: 'GET',
                    headers: buildAuthHeaders()
                });

                if (response.ok) {
                    const data = await response.json();
                    state.items = Array.isArray(data.items) ? data.items : [];
                    state.total = Number.isFinite(Number(data.total))
                        ? Number(data.total)
                        : countComments(state.items);
                    state.loaded = true;
                    if (options.highlightCommentId) {
                        state.highlightCommentId = options.highlightCommentId;
                        scheduleCommentHighlightClear(answerId, options.highlightCommentId);
                    }
                } else if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                    return;
                } else {
                    const err = await response.json().catch(() => ({}));
                    alert(`❌ 拉取评论失败: ${err.detail || response.status}`);
                }
            } catch (error) {
                console.error('拉取评论失败:', error);
                alert('❌ 网络错误，评论暂时无法加载。');
            } finally {
                state.loading = false;
                renderComments(answerId);
            }
        }

        async function preloadComments(answerId) {
            const state = getCommentState(answerId);
            if (state.loaded || state.loading) {
                updateCommentToolbar(answerId);
                return;
            }

            try {
                const response = await fetch(buildApiUrl(`/api/answers/${answerId}/comments`), {
                    method: 'GET',
                    headers: buildAuthHeaders()
                });

                if (response.ok) {
                    const data = await response.json();
                    state.items = Array.isArray(data.items) ? data.items : [];
                    state.total = Number.isFinite(Number(data.total))
                        ? Number(data.total)
                        : countComments(state.items);
                    state.loaded = true;
                    updateCommentToolbar(answerId);
                    if (state.visible) {
                        renderComments(answerId);
                    }
                } else if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                }
            } catch (error) {
                console.error('预加载评论失败:', error);
            }
        }

        async function toggleCommentPanel(answerId) {
            const state = getCommentState(answerId);
            state.visible = !state.visible;
            renderComments(answerId);

            if (state.visible && !state.loaded) {
                await loadComments(answerId);
            }
        }

        async function openCommentComposer(answerId) {
            if (!isAuthenticated()) {
                redirectToLogin('请先登录后再发表评论。');
                return;
            }
            if (!canCommentOnQuestion(currentQuestionDetail)) {
                alert('当前问题不再接受新评论。');
                return;
            }

            const state = getCommentState(answerId);
            state.visible = true;
            state.showComposer = true;
            renderComments(answerId);

            if (!state.loaded) {
                await loadComments(answerId);
            }

            renderComments(answerId);
            focusElementSoon(`comment-textarea-${answerId}`);
        }

        function cancelCommentComposer(answerId) {
            const state = getCommentState(answerId);
            state.showComposer = false;
            state.draft = '';
            renderComments(answerId);
        }

        async function toggleReplyComposer(answerId, commentId) {
            if (!isAuthenticated()) {
                redirectToLogin('请先登录后再回复评论。');
                return;
            }
            if (!canCommentOnQuestion(currentQuestionDetail)) {
                alert('当前问题不再接受新评论。');
                return;
            }

            const state = getCommentState(answerId);
            state.visible = true;
            state.activeReplyCommentId = state.activeReplyCommentId === commentId ? null : commentId;
            renderComments(answerId);

            if (!state.loaded) {
                await loadComments(answerId);
            }

            if (state.activeReplyCommentId === commentId) {
                focusElementSoon(`reply-textarea-${answerId}-${commentId}`);
            }
        }

        function cancelReplyComposer(answerId, commentId) {
            const state = getCommentState(answerId);
            state.activeReplyCommentId = null;
            delete state.replyDrafts[commentId];
            renderComments(answerId);
        }

        async function submitComment(answerId, parentCommentId = null) {
            const state = getCommentState(answerId);
            const draft = parentCommentId === null
                ? state.draft
                : (state.replyDrafts[parentCommentId] || '');
            const content = draft.trim();
            const currentUserId = getCurrentUserId();
            const token = sessionStorage.getItem('access_token');

            if (!content) {
                alert('评论内容不能为空。');
                return;
            }
            if (content.length > 2000) {
                alert('评论内容不能超过 2000 字，请精简后再发布。');
                return;
            }

            if (!currentUserId || !token) {
                redirectToLogin('请先登录后再发表评论。');
                return;
            }

            state.submittingTarget = parentCommentId === null ? 'root' : String(parentCommentId);
            renderComments(answerId);

            try {
                const payload = {
                    user_id: currentUserId,
                    content,
                };
                if (parentCommentId !== null) {
                    payload.parent_comment_id = parentCommentId;
                }

                const response = await fetch(buildApiUrl(`/api/answers/${answerId}/comments`), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    if (parentCommentId === null) {
                        state.draft = '';
                        state.showComposer = false;
                    } else {
                        delete state.replyDrafts[parentCommentId];
                        state.activeReplyCommentId = null;
                        state.expandedThreads[parentCommentId] = true;
                        state.hiddenThreads[parentCommentId] = false;
                    }
                    await loadComments(answerId, { highlightCommentId: data.comment_id });
                } else if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                    return;
                } else {
                    const err = await response.json().catch(() => ({}));
                    alert(`❌ 发布评论失败: ${getFriendlyDetailError(response, extractErrorDetail(err), '评论')}`);
                }
            } catch (error) {
                console.error('发布评论失败:', error);
                alert('❌ 网络错误，请稍后再试。');
            } finally {
                state.submittingTarget = null;
                renderComments(answerId);
            }
        }

        async function deleteComment(answerId, commentId) {
            const token = sessionStorage.getItem('access_token');
            if (!token) {
                redirectToLogin('请先登录后再删除评论。');
                return;
            }

            const confirmed = window.confirm('删除后会保留楼层结构，仅当前评论内容会变为占位提示，确认继续吗？');
            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch(buildApiUrl(`/api/comments/${commentId}`), {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    await loadComments(answerId);
                } else if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                    return;
                } else {
                    const err = await response.json().catch(() => ({}));
                    alert(`❌ 删除评论失败: ${err.detail || response.status}`);
                }
            } catch (error) {
                console.error('删除评论失败:', error);
                alert('❌ 网络错误，请稍后再试。');
            }
        }

        function getFollowUpState(answerId) {
            if (!followUpStateByAnswerId[answerId]) {
                followUpStateByAnswerId[answerId] = {
                    visible: false,
                    loadingSessions: false,
                    sessionsLoaded: false,
                    sessions: [],
                    loadingDetail: false,
                    errorMessage: '',
                    activeSessionId: null,
                    activeSession: null,
                    messages: [],
                    draft: '',
                    submitting: false,
                    newSessionMode: false,
                };
            }

            return followUpStateByAnswerId[answerId];
        }

        function canCurrentUserContinueSession(session) {
            return Boolean(session)
                && session.status === 'OPEN'
                && session.user_id === getCurrentUserId();
        }

        function getFollowUpSessionOwnerName(session) {
            if (!session) {
                return '追问用户';
            }
            return session.nickname || session.username || `用户 ${session.user_id}`;
        }

        function getFollowUpUserMessageLabel(state) {
            const session = state.activeSession;
            if (!session) {
                return '我';
            }
            const ownerName = getFollowUpSessionOwnerName(session);
            return session.user_id === getCurrentUserId()
                ? `${ownerName}（我）`
                : ownerName;
        }

        function updateFollowUpToolbar(answerId) {
            const state = getFollowUpState(answerId);
            const count = document.getElementById(`ai-followup-count-${answerId}`);
            const hint = document.getElementById(`ai-followup-hint-${answerId}`);
            const toggleBtn = document.getElementById(`toggle-ai-followup-btn-${answerId}`);

            if (count) {
                count.innerText = state.sessionsLoaded
                    ? `${state.sessions.length} 个会话`
                    : 'AI 追问';
            }

            if (hint) {
                if (state.loadingSessions) {
                    hint.innerText = '正在读取围绕这条 AI 回答的追问记录...';
                } else if (state.sessionsLoaded && state.sessions.length > 0) {
                    hint.innerText = '可以查看历史追问，也可以开启一轮新的 AI 追问。';
                } else {
                    hint.innerText = '围绕这条 AI 回答继续追问，AI 会结合原问题和历史上下文答复。';
                }
            }

            if (toggleBtn) {
                toggleBtn.innerText = state.visible ? '收起追问' : '追问 AI';
            }
        }

        function renderFollowUpSessions(answerId, questionId) {
            const state = getFollowUpState(answerId);

            if (state.loadingSessions) {
                return '<div class="ai-empty">正在加载追问会话...</div>';
            }

            if (state.errorMessage) {
                return `<div class="ai-empty">${escapeHtml(state.errorMessage)}</div>`;
            }

            const newSessionButton = `
                <button type="button" class="comment-btn primary" onclick="startNewFollowUpSession(${questionId}, ${answerId})">
                    新追问
                </button>
            `;

            if (!state.sessionsLoaded || state.sessions.length === 0) {
                return `
                    <div class="ai-session-header">
                        <strong>追问记录</strong>
                        ${newSessionButton}
                    </div>
                    <div class="ai-empty">还没有追问会话。可以直接开始第一轮追问。</div>
                `;
            }

            return `
                <div class="ai-session-header">
                    <strong>追问记录</strong>
                    ${newSessionButton}
                </div>
                ${state.sessions.map(session => {
                    const activeClass = state.activeSessionId === session.session_id ? ' active' : '';
                    const ownerName = getFollowUpSessionOwnerName(session);
                    const ownerLabel = session.user_id === getCurrentUserId()
                        ? `${ownerName}（我）`
                        : ownerName;
                    const statusLabel = session.status === 'OPEN' ? '进行中' : '已结束';
                    return `
                        <button type="button" class="ai-session-item${activeClass}" onclick="selectFollowUpSession(${questionId}, ${answerId}, ${session.session_id})">
                            <div class="ai-session-item-title">
                                <span>${escapeHtml(ownerLabel)}的会话</span>
                                <span>${statusLabel}</span>
                            </div>
                            <div class="ai-session-item-meta">
                                ${session.message_count || 0} 条消息 · ${formatDateTime(session.last_message_time || session.start_time)}
                            </div>
                        </button>
                    `;
                }).join('')}
            `;
        }

        function renderFollowUpMessages(answerId) {
            const state = getFollowUpState(answerId);

            if (state.loadingDetail) {
                return '<div class="ai-empty">正在加载会话详情...</div>';
            }

            if (state.errorMessage && state.messages.length === 0) {
                return `
                    <div class="ai-message system">
                        <div class="ai-message-content">${escapeHtml(state.errorMessage)}</div>
                    </div>
                `;
            }

            if (state.messages.length === 0) {
                return `
                    <div class="ai-message system">
                        <div class="ai-message-content">输入你的追问，AI 会结合原问题、首答和本会话历史继续回答。</div>
                    </div>
                `;
            }

            return state.messages.map(message => {
                const sender = String(message.sender_type || '').toLowerCase();
                const senderClass = sender === 'user' ? 'user' : (sender === 'ai' ? 'ai' : 'system');
                const senderLabel = sender === 'user' ? getFollowUpUserMessageLabel(state) : (sender === 'ai' ? 'AI 助手' : '系统');
                const modelLabel = message.model_name ? ` · ${escapeHtml(message.model_name)}` : '';
                const contentHtml = sender === 'ai'
                    ? renderMarkdown(message.content)
                    : escapeHtml(message.content);
                const contentClass = sender === 'ai'
                    ? 'ai-message-content markdown-content'
                    : 'ai-message-content';
                return `
                    <div class="ai-message ${senderClass}">
                        <div class="ai-message-meta">${senderLabel} · ${formatDateTime(message.send_time)}${modelLabel}</div>
                        <div class="${contentClass}">${contentHtml}</div>
                    </div>
                `;
            }).join('');
        }

            const panel = document.getElementById(`ai-followup-panel-${answerId}`);
            if (!panel) {
                return;
            }

            const state = getFollowUpState(answerId);

                <div class="ai-followup-layout">

                            <div>
                                <h4>${activeSession ? `会话 #${activeSession.session_id}` : '新的 AI 追问'}</h4>
                                <p>${composerHint}</p>
                            </div>
                            ${activeSession ? `<span class="comment-counter">${activeSession.message_count || state.messages.length} 条消息</span>` : ''}

                                class="ai-chat-textarea"

                                oninput="updateFollowUpDraft(${answerId}, this.value)"
                                ${canSubmit ? '' : 'disabled'}
                            >${escapeHtml(state.draft)}</textarea>
                            <div class="ai-chat-actions">
                                <span class="comment-composer-hint">${composerHint}</span>
                                <button
                                    type="button"
                                    class="comment-btn primary"

        function updateFollowUpDraft(answerId, value) {
            const state = getFollowUpState(answerId);
            state.draft = value;
        }

        async function preloadFollowUpSessions(questionId, answerId) {
            const state = getFollowUpState(answerId);
            if (!isAuthenticated() || !canCurrentUserUseAiFollowUp()) {
                updateFollowUpToolbar(answerId);
                return;
            }
            if (state.sessionsLoaded || state.loadingSessions) {
                updateFollowUpToolbar(answerId);
                return;
            }
            await loadFollowUpSessions(questionId, answerId, { silent: true });
        }

        async function loadFollowUpSessions(questionId, answerId, options = {}) {
            const token = sessionStorage.getItem('access_token');
            const state = getFollowUpState(answerId);
            if (!canCurrentUserUseAiFollowUp()) {
                state.visible = false;
                state.errorMessage = '只有提问者可以使用 AI 追问。';
                updateFollowUpToolbar(answerId);
                if (!options.silent) {
                    alert('只有提问者可以使用 AI 追问。');
                }
                return;
            }
            if (!token) {
                redirectToLogin('请先登录后再查看 AI 追问。');
                return;
            }
            if (state.loadingSessions) {
                return;
            }

            state.loadingSessions = true;
            state.errorMessage = '';
            if (!options.silent) {
                renderFollowUpPanel(questionId, answerId);
            } else {
                updateFollowUpToolbar(answerId);
            }

            try {
                const response = await fetch(buildApiUrl(`/api/questions/${questionId}/answers/${answerId}/follow-up-sessions`), {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    state.sessions = Array.isArray(data.items) ? data.items : [];
                    state.sessionsLoaded = true;
                    if (!state.activeSessionId && state.sessions.length > 0 && !state.newSessionMode) {
                        state.activeSessionId = state.sessions[0].session_id;
                    }
                } else if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                    return;
                } else {
                    const err = await response.json().catch(() => ({}));
                    state.errorMessage = response.status >= 500
                        ? 'AI 追问后端暂时不可用，请确认多轮追问数据库迁移已经执行。'
                        : (err.detail || `拉取 AI 追问会话失败：${response.status}`);
                    if (!options.silent) {
                        renderFollowUpPanel(questionId, answerId);
                    }
                }
            } catch (error) {
                console.error('拉取 AI 追问会话失败:', error);
                state.errorMessage = '网络错误，AI 追问会话暂时无法加载。';
            } finally {
                state.loadingSessions = false;
                updateFollowUpToolbar(answerId);
                if (!options.silent) {
                    renderFollowUpPanel(questionId, answerId);
                }
            }
        }

        async function toggleFollowUpPanel(questionId, answerId) {
            if (!isAuthenticated()) {
                redirectToLogin('请先登录后再查看 AI 追问。');
                return;
            }
            if (!canCurrentUserUseAiFollowUp()) {
                alert('只有提问者可以使用 AI 追问。');
                return;
            }
            const state = getFollowUpState(answerId);
            state.visible = !state.visible;
            renderFollowUpPanel(questionId, answerId);

            if (state.visible && !state.sessionsLoaded) {
                await loadFollowUpSessions(questionId, answerId);
            }

            if (state.visible && state.activeSessionId && state.messages.length === 0 && !state.newSessionMode) {
                await selectFollowUpSession(questionId, answerId, state.activeSessionId);
            }

            if (state.visible && !state.activeSessionId) {
                focusElementSoon(`ai-followup-draft-${answerId}`);
            }
        }

        async function selectFollowUpSession(questionId, answerId, sessionId) {
            const token = sessionStorage.getItem('access_token');
            const state = getFollowUpState(answerId);
            if (!canCurrentUserUseAiFollowUp()) {
                alert('只有提问者可以使用 AI 追问。');
                return;
            }
            if (!token) {
                redirectToLogin('请先登录后再查看 AI 会话。');
                return;
            }

            state.activeSessionId = sessionId;
            state.newSessionMode = false;
            state.loadingDetail = true;
            state.errorMessage = '';
            state.messages = [];
            renderFollowUpPanel(questionId, answerId);

            try {
                const response = await fetch(buildApiUrl(`/api/chat/sessions/${sessionId}`), {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    state.activeSession = data.session || null;
                    state.messages = Array.isArray(data.messages) ? data.messages : [];
                    const matchedIndex = state.sessions.findIndex(item => item.session_id === sessionId);
                    if (matchedIndex >= 0 && data.session) {
                        state.sessions[matchedIndex] = data.session;
                    }
                } else if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                    return;
                } else {
                    const err = await response.json().catch(() => ({}));
                    state.errorMessage = response.status >= 500
                        ? 'AI 会话详情暂时不可用，请确认多轮追问数据库迁移已经执行。'
                        : (err.detail || `拉取 AI 会话详情失败：${response.status}`);
                }
            } catch (error) {
                console.error('拉取 AI 会话详情失败:', error);
                state.errorMessage = '网络错误，AI 会话暂时无法加载。';
            } finally {
                state.loadingDetail = false;
                renderFollowUpPanel(questionId, answerId);
            }
        }

        async function startNewFollowUpSession(questionId, answerId) {
            if (!isAuthenticated()) {
                redirectToLogin('请先登录后再追问 AI。');
                return;
            }
            if (!canCurrentUserUseAiFollowUp()) {
                alert('只有提问者可以使用 AI 追问。');
                return;
            }
            const state = getFollowUpState(answerId);
            state.visible = true;
            state.activeSessionId = null;
            state.activeSession = null;
            state.messages = [];
            state.draft = '';
            state.errorMessage = '';
            state.newSessionMode = true;
            renderFollowUpPanel(questionId, answerId);
            if (!state.sessionsLoaded) {
                await loadFollowUpSessions(questionId, answerId, { silent: true });
                renderFollowUpPanel(questionId, answerId);
            }
            focusElementSoon(`ai-followup-draft-${answerId}`);
        }

        async function submitFollowUp(questionId, answerId) {
            const token = sessionStorage.getItem('access_token');
            const state = getFollowUpState(answerId);
            const content = state.draft.trim();

            if (!canCurrentUserUseAiFollowUp()) {
                alert('只有提问者可以使用 AI 追问。');
                return;
            }

            if (!token) {
                redirectToLogin('请先登录后再追问 AI。');
                return;
            }

            if (!content) {
                alert('追问内容不能为空。');
                return;
            }

            if (state.activeSession && !canCurrentUserContinueSession(state.activeSession)) {
                alert('这条会话只能查看，不能继续追问。');
                return;
            }

            state.submitting = true;
            state.errorMessage = '';
            renderFollowUpPanel(questionId, answerId);

            try {
                const payload = { content };
                if (state.activeSessionId) {
                    payload.session_id = state.activeSessionId;
                }

                const response = await fetch(buildApiUrl(`/api/questions/${questionId}/answers/${answerId}/follow-up`), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    state.activeSession = data.session || null;
                    state.activeSessionId = data.session?.session_id || state.activeSessionId;
                    state.messages = Array.isArray(data.messages) ? data.messages : [];
                    state.draft = '';
                    state.newSessionMode = false;
                    state.sessionsLoaded = false;
                    await loadFollowUpSessions(questionId, answerId, { silent: true });
                    renderFollowUpPanel(questionId, answerId);
                } else if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                    return;
                } else {
                    const err = await response.json().catch(() => ({}));
                    state.errorMessage = response.status >= 500
                        ? 'AI 追问后端暂时不可用，请确认多轮追问数据库迁移已经执行。'
                        : (err.detail || `AI 追问失败：${response.status}`);
                }
            } catch (error) {
                console.error('AI 追问失败:', error);
                state.errorMessage = '网络错误，AI 追问暂时无法完成。';
            } finally {
                state.submitting = false;
                renderFollowUpPanel(questionId, answerId);
            }
        }

        async function loadQuestionDetail(resetBrowseSession = false, retryAsGuest = true) {
            const questionId = getCurrentQuestionId();

            if (!questionId) {
                document.getElementById('detail-container').innerHTML = '<div style="color:red">❌ 找不到帖子 ID</div>';
                return;
            }

            try {
                const response = await fetch(buildApiUrl(`/api/questions/${questionId}`), {
                    method: 'GET',
                    headers: buildAuthHeaders()
                });

                if (response.ok) {
                    const data = await response.json();
                    await hydrateQuestionImages(data);
                    currentQuestionDetail = data;
                    if (resetBrowseSession) {
                        detailOpenedAt = Date.now();
                        browseHistoryRecorded = false;
                    }
                    renderDetail(data);
                } else if ([401, 403, 423].includes(response.status)) {
                    if (sessionStorage.getItem('access_token') && retryAsGuest) {
                        switchToGuestMode();
                        return loadQuestionDetail(resetBrowseSession, false);
                    }
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                } else {
                    document.getElementById('detail-container').innerHTML = `<div style="color:red">❌ 拉取失败，可能帖子被删了，或者后端没写这个接口 (状态码: ${response.status})</div>`;
                }
            } catch (error) {
                console.error(error);
                document.getElementById('detail-container').innerHTML = '<div style="color:red">❌ 网络错误，后端服务挂了吗？</div>';
            }
        }
