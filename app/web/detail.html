<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问题详情 - AI 问答社区</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* 保持一致的高级 UI 风格 */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 14px 32px rgba(15, 23, 42, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #eef4ff 0%, #f8fafc 240px, var(--bg-color) 520px);
            margin: 0;
            color: var(--text-main);
            line-height: 1.55;
        }
        .navbar {
            background-color: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--border-color);
            padding: 0 clamp(18px, 4vw, 40px);
            min-height: 68px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(12px);
        }
        .navbar-brand { font-size: 21px; font-weight: 800; color: var(--primary); cursor: pointer; text-decoration: none; white-space: nowrap; }
        .navbar-sections {
            display: flex;
            align-items: center;
            gap: 26px;
            margin-left: 28px;
            flex: 0 0 auto;
        }
        .section-link {
            color: #374151;
            font-size: 16px;
            font-weight: 800;
            padding: 22px 0 19px;
            text-decoration: none;
            position: relative;
            white-space: nowrap;
        }
        .section-link:hover {
            color: #1d4ed8;
        }
        .nav-search-shell {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 520px;
            margin: 0 32px 0 46px;
            position: relative;
        }
        .nav-search-input {
            flex: 1;
            min-width: 0;
            height: 42px;
            padding: 0 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
        }
        .nav-search-input:focus {
            border-color: #93c5fd;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
        }
        .nav-search-button {
            height: 42px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .nav-search-history-dropdown {
            display: none;
            position: absolute;
            top: 50px;
            left: 0;
            right: 88px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: var(--shadow-md);
            z-index: 1000;
            padding: 8px 0;
            overflow: hidden;
        }
        .nav-search-history-item {
            padding: 10px 16px;
            font-size: 14px;
            color: #4b5563;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-search-history-item:hover {
            background: #f3f4f6;
        }
        .navbar-user { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; position: relative; }
        .user-greeting { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .nav-login-button {
            height: 40px;
            padding: 0 18px;
            border: 1px solid #bfdbfe;
            border-radius: 999px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
        }
        .nav-login-button:hover {
            background: #dbeafe;
            border-color: #93c5fd;
            transform: translateY(-1px);
        }
        .user-menu { position: relative; }
        .user-avatar-button {
            width: 46px;
            height: 46px;
            border: 1px solid #dbeafe;
            border-radius: 999px;
            padding: 3px;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }
        .user-avatar-button:hover {
            transform: translateY(-1px);
            border-color: #93c5fd;
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.14);
        }
        .nav-avatar {
            width: 100%;
            height: 100%;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 15px;
            font-weight: 800;
        }
        .nav-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .user-menu-panel {
            display: none;
            position: absolute;
            right: 0;
            top: 58px;
            width: 190px;
            padding: 10px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 18px 38px rgba(15, 23, 42, 0.16);
            z-index: 1200;
        }
        .user-menu-panel.open { display: grid; gap: 6px; }
        .user-menu-panel::before {
            content: "";
            position: absolute;
            top: -8px;
            right: 18px;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-left: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
            transform: rotate(45deg);
        }
        .user-menu-item {
            width: 100%;
            border: none;
            background: transparent;
            color: #475569;
            padding: 11px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease;
        }
        .user-menu-item:hover {
            background: #eff6ff;
            color: #1d4ed8;
        }
        .user-menu-item.danger:hover {
            background: #fef2f2;
            color: #dc2626;
        }
        .btn-outline {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            color: #334155;
            font-weight: 600;
        }
        .btn-outline:hover { background: #f9fafb; border-color: #d1d5db; }

        /* 🌟 修改容器：加宽，并采用 1fr 和 300px 的左右分栏布局 */
        .container {
            max-width: 1180px; /* 原来是800，加宽以容纳侧边栏 */
            margin: 38px auto 56px;
            padding: 0 clamp(18px, 4vw, 28px);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px; /* 左侧自适应，右侧固定 */
            gap: 28px;
            align-items: start; /* 确保左右两边各自独立滚动 */
        }

        /* 🌟 新增：右侧悬浮面板专属样式 */
        .sidebar-sticky {
            position: sticky;
            top: 88px; /* 距离顶部的距离（避开导航栏） */
        }

        .detail-card {
            background: var(--card-bg);
            padding: 34px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }
        .detail-card:hover { box-shadow: var(--shadow-md); }
        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 18px;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .back-link:hover { text-decoration: underline; }

        .q-title { font-size: 28px; font-weight: 800; margin: 0 0 16px 0; line-height: 1.35; letter-spacing: -0.01em; }
        .q-meta { font-size: 14px; color: var(--text-muted); display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border-color); }
        .q-content { font-size: 16px; line-height: 1.8; white-space: pre-wrap; color: #334155; min-height: 100px; }
        .author-meta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            font-weight: 650;
        }
        .mini-avatar {
            width: 26px;
            height: 26px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid #bfdbfe;
            flex: 0 0 auto;
        }
        .mini-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .mini-avatar.ai {
            background: #e0e7ff;
            color: #3730a3;
            border-color: #c7d2fe;
        }

        /* 加载状态的样式 */
        #loading { text-align: center; padding: 40px; color: var(--text-muted); }

        /* 🌟 评论折叠专属样式 */
        .answer-wrapper {
            position: relative;
            max-height: 160px; /* 默认只显示大约 6 行的高度 */
            overflow: hidden;
            transition: max-height 0.3s ease; /* 展开时有一个平滑的动画 */
        }

        .answer-wrapper.expanded {
            max-height: 5000px; /* 展开后解除限制（给个巨大的值配合动画） */
        }

        /* 底部淡出的雾化遮罩层 */
        .fade-mask {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 80px;
            /* 从透明过渡到卡片的底色 #f8fafc */
            background: linear-gradient(to bottom, rgba(248, 250, 252, 0), rgba(248, 250, 252, 1));
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* 展开后，遮罩层变得完全透明 */
        .answer-wrapper.expanded .fade-mask { opacity: 0; }

        /* 展开/收起按钮 */
        .toggle-btn {
            color: var(--primary);
            background: none; border: none; padding: 12px 0 0 0;
            font-size: 14px; font-weight: 600; cursor: pointer; display: inline-block;
        }
        .toggle-btn:hover { text-decoration: underline; }

        /* 🌟 Markdown 富文本专属美化样式 */
        .markdown-content p { margin-bottom: 12px; }
        .markdown-content ul, .markdown-content ol { padding-left: 24px; margin-bottom: 12px; }
        .markdown-content blockquote { border-left: 4px solid #cbd5e1; color: #64748b; padding-left: 12px; margin: 12px 0; background: #f8fafc; padding: 8px 12px; border-radius: 4px; }

        /* 🌟 代码块的黑底框框（VS Code 风格） */
        .markdown-content pre {
            background-color: #282c34 !important; /* 极客黑底 */
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 16px 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .markdown-content code {
            font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
            font-size: 14px;
        }
        /* 🌟 行内小代码块（红字灰底） */
        .markdown-content p code, .markdown-content li code {
            background-color: #f1f5f9;
            color: #e11d48;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .media-uploader {
            margin-bottom: 16px;
            padding: 12px;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            background: #f8fafc;
        }

        .media-uploader-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
        }

        .media-upload-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 11px;
            border-radius: 999px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .media-upload-hint {
            margin: 0;
            font-size: 12px;
            line-height: 1.5;
            color: #64748b;
        }

        .media-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .media-preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            background: #e2e8f0;
            border: 1px solid #e2e8f0;
        }

        .media-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .media-preview-remove {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            border-radius: 999px;
            border: none;
            background: rgba(15, 23, 42, 0.72);
            color: white;
            cursor: pointer;
            font-size: 13px;
            line-height: 20px;
            padding: 0;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .media-grid-item {
            position: relative;
        }

        .media-grid-item img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            cursor: zoom-in;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .media-grid-item img:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
        }

        .media-delete-button {
            position: absolute;
            top: 8px;
            right: 8px;
            border: none;
            border-radius: 999px;
            padding: 6px 10px;
            background: rgba(220, 38, 38, 0.92);
            color: #ffffff;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(127, 29, 29, 0.24);
            opacity: 0;
            transform: translateY(-2px);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .media-grid-item:hover .media-delete-button,
        .media-delete-button:focus-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .comment-shell {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .comment-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .comment-toolbar-main {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .comment-counter {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            font-size: 12px;
            font-weight: 700;
        }

        .comment-toolbar-hint {
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        .comment-toolbar-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .comment-btn {
            border-radius: 999px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .comment-btn:hover:not(:disabled) {
            border-color: #93c5fd;
            color: #1d4ed8;
            background: #eff6ff;
        }

        .comment-btn.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }

        .comment-btn.primary:hover:not(:disabled) {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: white;
        }

        .comment-btn.subtle {
            background: #f8fafc;
        }

        .comment-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .comment-panel {
            margin-top: 16px;
            padding: 18px;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid #dbeafe;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .comment-panel.loading,
        .comment-empty {
            color: #64748b;
            font-size: 14px;
            text-align: center;
            padding: 24px 12px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .comment-item {
            background: #f8fbff;
            border: 1px solid #dbeafe;
            border-radius: 14px;
            padding: 16px;
            transition: box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
        }

        .comment-item.reply {
            background: #fcfdff;
        }

        .comment-item.highlighted {
            border-color: #60a5fa;
            background: #eff6ff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .comment-item.deleted,
        .comment-item.hidden {
            background: #f8fafc;
            border-style: dashed;
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .comment-author-line {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .comment-author {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
        }

        .comment-time {
            color: #94a3b8;
            font-size: 12px;
        }

        .comment-status-badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 700;
        }

        .comment-status-badge.active {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .comment-status-badge.hidden {
            background: #fef3c7;
            color: #b45309;
        }

        .comment-status-badge.deleted {
            background: #e5e7eb;
            color: #4b5563;
        }

        .comment-content {
            white-space: pre-wrap;
            line-height: 1.7;
            color: #334155;
            font-size: 14px;
        }

        .comment-reply-target {
            color: #1d4ed8;
            font-weight: 700;
        }

        .comment-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .comment-action-link {
            border: none;
            background: none;
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            padding: 0;
        }

        .comment-action-link.muted {
            color: #64748b;
        }

        .comment-action-link.danger {
            color: #dc2626;
        }

        .comment-action-link:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .comment-children {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .comment-composer {
            margin-top: 16px;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #bfdbfe;
            background: #f8fbff;
        }

        .comment-composer-title {
            margin: 0 0 10px 0;
            font-size: 13px;
            font-weight: 700;
            color: #1e3a8a;
        }

        .comment-textarea {
            width: 100%;
            min-height: 88px;
            resize: vertical;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            padding: 12px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
            background: white;
        }

        .comment-textarea:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .char-counter {
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
            text-align: right;
        }

        .char-counter.warning {
            color: #b45309;
        }

        .char-counter.error {
            color: #dc2626;
            font-weight: 700;
        }

        .comment-composer-footer {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .comment-composer-hint {
            color: #64748b;
            font-size: 12px;
        }

        .comment-composer-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ai-followup-shell {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #dbeafe;
        }

        .ai-followup-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 14px 16px;
            border: 1px solid #bfdbfe;
            border-radius: 16px;
            background: linear-gradient(180deg, #f8fbff 0%, #eff6ff 100%);
        }

        .ai-followup-title {
