                        authorName = ans.provider_name;
                        authorIcon = '🤖';
                        tagColor = 'background: #dbeafe; color: #1e40af;'; // AI：科技蓝
                        authorAvatarHtml = renderMiniAvatar(authorName, '', 'AI');
                    }

                    const followUpHtml = canUseAiFollowUp ? `
                            <div class="ai-followup-shell">
                                <div class="ai-followup-toolbar">
                                    <div>
                                        <div class="ai-followup-title">
                                            <span>AI</span>
                                            <strong>继续追问这条 AI 回答</strong>
                                            <small id="ai-followup-count-${ansId}" class="comment-counter">AI 追问</small>
                                        </div>
                                        <p id="ai-followup-hint-${ansId}" class="ai-followup-hint">围绕这条 AI 回答继续追问，AI 会结合原问题和历史上下文答复。</p>
                                    </div>
                                    <div class="ai-followup-actions">
                                        <button id="toggle-ai-followup-btn-${ansId}" type="button" class="comment-btn subtle" onclick="toggleFollowUpPanel(${q.question_id}, ${ansId})">追问 AI</button>
                                        <button type="button" class="comment-btn primary" onclick="startNewFollowUpSession(${q.question_id}, ${ansId})">新追问</button>
                                    </div>
                                </div>
                                <div id="ai-followup-panel-${ansId}" class="ai-followup-panel"></div>
                            </div>
                    ` : '';

                    // 组装带高级样式的 HTML
                    answersHtml += `
                        <div class="${answerCardClass}">

                            <div style="font-size: 14px; color: #475569; margin-bottom: 16px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                    <span style="${tagColor} padding: 4px 10px 4px 6px; border-radius: 999px; font-size: 12px; display:inline-flex; align-items:center; gap:7px;">${authorAvatarHtml}<span>${authorIcon} ${escapeHtml(authorName)}</span></span>
                                    <span style="font-weight: normal; font-size: 13px; color: #94a3b8;">回答于 ${ansDate}</span>
                                </div>
                                ${acceptedBadge}
                            </div>

                            <div id="wrapper-${ansId}" class="answer-wrapper">
                                <div class="markdown-content" style="font-size: 15px; line-height: 1.8; color: #334155;">
                                    ${renderMarkdown(ans.content)}
                                </div>
                                ${renderMediaGrid(ans.images, '回答配图', {
                                    canDelete: !isQuestionDeleted && currentUserId === Number(ans.user_id) && (ans.answer_type === 'MANUAL' || !ans.provider_name),
                                    ownerType: 'answer',
                                    ownerId: ans.answer_id
                                })}
                                <div id="mask-${ansId}" class="fade-mask"></div>
                            </div>

                            <button id="btn-${ansId}" class="toggle-btn" style="margin-bottom: 12px;" onclick="toggleAnswer(${ansId})">阅读全文 ↓</button>

                            <div class="answer-actions">
                                <button id="like-btn-${ansId}" class="answer-action-button" onclick="toggleFeedback(${ansId}, 'Y')">
                                    👍 <span id="like-count-${ansId}">${ans.like_count || 0}</span>
                                </button>
                                <button id="dislike-btn-${ansId}" class="answer-action-button" onclick="toggleFeedback(${ansId}, 'N')">
                                    👎 <span id="dislike-count-${ansId}">${ans.dislike_count || 0}</span>
                                </button>
                                ${acceptButtonHtml}
                                ${deleteAnswerButtonHtml}
                            </div>

                            ${followUpHtml}

                            <div class="comment-shell">
                                <div class="comment-toolbar">
                                    <div class="comment-toolbar-main">
                                        <span class="comment-counter" id="comment-count-${ansId}">评论区</span>
                                        <span class="comment-toolbar-hint" id="comment-toolbar-hint-${ansId}">
                                            ${canComment ? '围绕这条回答继续交流，也可以直接回复他人的评论。' : '当前问题不再接受新评论，但仍可查看已有讨论。'}
                                        </span>
                                    </div>
                                    <div class="comment-toolbar-actions">
                                        <button id="toggle-comments-btn-${ansId}" type="button" class="comment-btn subtle" onclick="toggleCommentPanel(${ansId})">展开评论</button>
                                        <button id="open-comment-btn-${ansId}" type="button" class="comment-btn primary" onclick="openCommentComposer(${ansId})" ${canComment ? '' : 'disabled'}>${canComment ? '发表评论' : '当前不可评论'}</button>
                                    </div>
                                </div>
                                <div id="comments-panel-${ansId}" class="comment-panel" style="display:none;"></div>
                            </div>

                        </div>
                    `;
                });
            } else {
                answersHtml += '<div style="color: #9ca3af; margin-top: 32px; font-size: 15px; text-align: center; background: #f9fafb; padding: 32px; border-radius: 12px;">暂时还没有人（或 AI）回答，快来抢沙发吧！</div>';
            }

            container.innerHTML = `
                <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px;">
                    <h1 class="q-title" style="margin-bottom: 0;">${escapeHtml(q.title)}</h1>
                    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
                        ${favoriteButtonHtml}
                        ${deleteQuestionButtonHtml}
                        ${statusBadge}
                    </div>
                </div>
                <div class="q-meta">
                    ${questionAuthorHtml}
                    <span>⏱ ${date}</span>
                    <span>⭐ ${q.favorite_count || 0} 次收藏</span>
                    <span>💬 ${q.answer_count || 0} 条回答</span>
                    <span>${resolutionText}</span>
                </div>
                <div class="q-content">${content}</div>
                ${questionImagesHtml}
                ${answersHtml} `;
            syncAnswerComposer(q);

            // 🌟 智能检测：如果回答本来就很短，就不显示展开按钮了
            if (q.answers && q.answers.length > 0) {
                q.answers.forEach(ans => {
                    const wrapper = document.getElementById(`wrapper-${ans.answer_id}`);
                    const btn = document.getElementById(`btn-${ans.answer_id}`);
                    const mask = document.getElementById(`mask-${ans.answer_id}`);

                    // scrollHeight 是文字的真实高度，如果小于或等于我们设定的 160px，就直接完全展示
                    if (wrapper && wrapper.scrollHeight <= 160) {
                        wrapper.classList.add('expanded');
                        if (btn) btn.style.display = 'none';
                        if (mask) mask.style.display = 'none';
                    }
                });
            }

            // 🌟 在页面 HTML 渲染完毕后，立刻去拉取私人状态！
            const qId = getCurrentQuestionId();
            if (qId) {
                loadMyFeedbacks(qId);
            }

            if (q.answers && q.answers.length > 0) {
                q.answers.forEach(ans => {
                    const state = getCommentState(ans.answer_id);
                    updateCommentToolbar(ans.answer_id);
                    preloadComments(ans.answer_id);
                    if (ans.answer_type === 'AI' && canCurrentUserUseAiFollowUp(q)) {
                        const followUpState = getFollowUpState(ans.answer_id);
                        updateFollowUpToolbar(ans.answer_id);
                        preloadFollowUpSessions(q.question_id, ans.answer_id);
                        if (followUpState.visible) {
                            renderFollowUpPanel(q.question_id, ans.answer_id);
                        }
                    }
                    if (state.visible) {
                        renderComments(ans.answer_id);
                        if (!state.loaded) {
                            loadComments(ans.answer_id);
                        }
                    }
                });
            }
        }

        async function deleteCurrentQuestion(questionId) {
            if (!isAuthenticated()) {
                redirectToLogin('请先登录后再删除帖子。');
                return;
            }

            const confirmed = window.confirm('确定要删除这篇帖子吗？删除后其他用户将无法继续浏览或操作。');
            if (!confirmed) {
                return;
            }

            try {
                const response = await fetch(buildApiUrl(`/api/questions/${questionId}`), {
                    method: 'DELETE',
                    headers: buildAuthHeaders()
                });

                if (response.ok) {
                    localStorage.setItem('user_center_active_tab', 'questions');
                    alert('帖子已删除。');
                    window.location.href = '/home';
                    return;
                }

                if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                    return;
                }

                const err = await response.json().catch(() => ({}));
                alert(`删除失败：${err.detail || `请求失败（${response.status}）`}`);
            } catch (error) {
                console.error('删除帖子失败:', error);
                alert('删除失败，请稍后再试。');
            }
        }

        function getFriendlyDeleteAnswerError(response, detail) {
            const text = String(detail || '');
            if (response.status === 404 && (text === 'Not Found' || !text)) {
                return '当前服务器没有匹配到删除回答接口，请确认后端已部署最新版本。';
            }
            if (text.includes('Accepted answers cannot be deleted')) {
                return '已采纳回答不能直接删除，请先更换采纳答案。';
            }
            if (text.includes('Only the answer author or an admin')) {
                return '只能删除自己发布的人工回答，或由管理员删除。';
            }
            if (text.includes('Answer has already been deleted')) {
                return '这条回答已经删除，无需重复操作。';
            }
            if (text.includes('was not found')) {
                return '这条回答不存在或已被删除。';
            }
            if (response.status === 403) {
                return '你没有权限删除这条回答。';
            }
            if (response.status >= 500) {
                return '服务暂时异常，请稍后重试或联系管理员。';
            }
            return text || `请求失败（${response.status}）`;
        }

        function getDeleteAnswerApiPath(answerId) {
            return String(getCurrentUserRole()).toUpperCase() === 'ADMIN'
                ? `/api/admin/answers/${answerId}`
                : `/api/answers/${answerId}`;
        }

        async function deleteAnswer(answerId) {
            if (!isAuthenticated()) {
                redirectToLogin('请先登录后再删除回答。');
                return;
            }

            const confirmed = window.confirm('确定要删除这条回答吗？删除后该回答将不再展示。');
            if (!confirmed) {
                return;
            }

            const button = document.getElementById(`delete-answer-btn-${answerId}`);
            const originalText = button?.textContent || '删除回答';
            if (button) {
                button.textContent = '删除中...';
                button.disabled = true;
            }

            try {
                const response = await fetch(buildApiUrl(getDeleteAnswerApiPath(answerId)), {
                    method: 'DELETE',
                    headers: buildAuthHeaders()
                });

                if (response.ok) {
                    alert('回答已删除。');
                    await loadQuestionDetail(false);
                    return;
                }

                const err = await response.json().catch(() => ({}));
                const detail = extractErrorDetail(err);

                if ([401, 423].includes(response.status)) {
                    redirectToLogin(detail || '登录状态已失效，请重新登录。');
                    return;
                }

                alert(`删除失败：${getFriendlyDeleteAnswerError(response, detail)}`);
            } catch (error) {
                console.error('删除回答失败:', error);
                alert('删除失败，请稍后再试。');
            } finally {
                if (button) {
                    button.textContent = originalText;
                    button.disabled = false;
                }
            }
        }

        async function acceptAnswer(questionId, answerId) {
            const token = sessionStorage.getItem('access_token');
            if (!token || !getCurrentUserId()) {
                redirectToLogin('请先登录后再采纳答案。');
                return;
            }

            try {
                const response = await fetch(buildApiUrl(`/api/questions/${questionId}/accept-answer`), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ answer_id: answerId })
                });

                if (response.ok) {
                    const data = await response.json();
                    renderDetail(data);
                    alert('✅ 已更新采纳答案。');
                } else if (response.status === 401) {
                    redirectToLogin('登录状态已失效，请重新登录。');
                } else {
                    const err = await response.json();
                    alert("❌ 采纳失败: " + JSON.stringify(err));
                }
            } catch (error) {
                console.error("采纳答案失败:", error);
                alert("❌ 网络错误，请稍后再试。");
            }
        }

        async function toggleFavorite(questionId, isFavorited) {
            const token = sessionStorage.getItem('access_token');
            const userId = getCurrentUserId();
            if (!token || !userId) {
                redirectToLogin('请先登录后再执行收藏操作。');
                return;
            }

            try {
                const url = isFavorited
                    ? buildApiUrl(`/api/questions/${questionId}/favorite`, { user_id: userId })
                    : buildApiUrl(`/api/questions/${questionId}/favorite`);
                const response = await fetch(url, {
                    method: isFavorited ? 'DELETE' : 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: isFavorited ? undefined : JSON.stringify({ user_id: userId })
                });

                if (response.ok) {
                    await loadQuestionDetail(false);
                } else if ([401, 403, 423].includes(response.status)) {
                    const err = await response.json().catch(() => ({}));
                    redirectToLogin(err.detail || '登录状态已失效，请重新登录。');
                } else {
                    const err = await response.json().catch(() => ({}));
                    alert(`❌ 收藏操作失败: ${err.detail || response.status}`);
                }
            } catch (error) {
                console.error("切换收藏失败:", error);
                alert("❌ 网络错误，请稍后再试。");
            }
        }

        // 🌟 展开/收起触发函数
        function toggleAnswer(ansId) {
            const wrapper = document.getElementById(`wrapper-${ansId}`);
            const btn = document.getElementById(`btn-${ansId}`);

            // 如果已经是展开状态，就移除 expanded 类，并改文字为向下箭头
            if (wrapper.classList.contains('expanded')) {
                wrapper.classList.remove('expanded');
                btn.innerText = '阅读全文 ↓';
            } else {
                // 如果是折叠状态，就加上 expanded 类，并改文字为向上箭头
                wrapper.classList.add('expanded');
                btn.innerText = '收起全文 ↑';
            }
        }

        // 🌟 真正提交回答到后端（完美适配原作者接口）
        async function submitAnswer() {
            const token = sessionStorage.getItem('access_token');
            if (!token || !getCurrentUserId()) {
                redirectToLogin('请先登录后再发布回答。');
                return;
            }

            const content = document.getElementById('my-answer-content').value.trim();
            if (!content) {
                alert("❌ 还没有填写回答内容哦！");
                return;
            }
            if (content.length > 10000) {
                alert("❌ 回答内容不能超过 10000 字，请精简后再发布。");
                return;
            }

            const questionId = getCurrentQuestionId();
            const imagesToUpload = [...selectedAnswerImages];

            // 按钮变灰，防止用户狂点
            const btn = document.querySelector('button[onclick="submitAnswer()"]');
            const originalText = btn.innerText;
            btn.innerText = "发布中...";
            btn.disabled = true;

            try {
                // 拿着房卡去敲原作者真正的大门
                const response = await fetch(buildApiUrl(`/api/questions/${questionId}/answers`), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        content: content
                    })
                });

                if (response.ok) {
                    const questionData = await response.json();
                    const answerId = findCreatedAnswerId(questionData, content);

                    if (imagesToUpload.length > 0) {
                        if (!answerId) {
                            alert("回答已发布，但没有定位到新回答，图片暂时无法上传。");
                        } else {
                            btn.innerText = `上传图片中 0/${imagesToUpload.length}...`;
                            try {
                                await uploadAnswerImages(answerId, imagesToUpload, token, (done, total) => {
                                    btn.innerText = `上传图片中 ${done}/${total}...`;
                                });
                            } catch (uploadError) {
                                console.error(uploadError);
                                alert(`回答已发布，但图片上传失败：${uploadError.message}`);
                            }
                        }
                    }

                    document.getElementById('my-answer-content').value = '';
                    updateAnswerContentCounter();
                    resetAnswerImageSelection();
                    await loadQuestionDetail(false);
                } else if (response.status === 401) {
                    redirectToLogin('登录状态已失效，请重新登录。');
                } else {
                    const detail = await readErrorDetail(response);
                    alert("❌ 发布失败: " + getFriendlyDetailError(response, detail, '回答'));
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert("❌ 网络错误，请检查后端服务！");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // 🌟 商业级反馈交互：无刷新、带变色动画、局部 DOM 更新
        async function toggleFeedback(answerId, isLike) {
            const token = sessionStorage.getItem('access_token');
            if (!token || !getCurrentUserId()) {
                redirectToLogin('请先登录后再进行点赞或点踩。');
                return;
            }
            const likeCountSpan = document.getElementById(`like-count-${answerId}`);
            const dislikeCountSpan = document.getElementById(`dislike-count-${answerId}`);

            try {
                const response = await fetch(buildApiUrl(`/api/answers/${answerId}/feedback`), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ is_like: isLike }) // 'Y' 或 'N'
                });

                if (response.ok) {
                    const data = await response.json();
                    likeCountSpan.innerText = data.like_count ?? 0;
                    dislikeCountSpan.innerText = data.dislike_count ?? 0;
                    applyFeedbackState(answerId, data.is_like);
                } else if (response.status === 401) {
                    redirectToLogin('登录状态已失效，请重新登录。');
                } else {
                    const err = await response.json();
                    alert("❌ 操作失败: " + JSON.stringify(err));
                }
            } catch (error) {
                console.error("网络请求错误:", error);
            }
        }

        // 🌟 页面加载后，自动去后端拉取“我”的私人点赞状态，并给按钮涂上蓝色！
        async function loadMyFeedbacks(questionId) {
            const token = sessionStorage.getItem('access_token');
            if (!token) return; // 没登录就不拉取了

            try {
                // 去敲我们刚建好的私人通道
                const response = await fetch(buildApiUrl(`/api/questions/${questionId}/feedbacks`), {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const feedbacks = await response.json();
                    // feedbacks 长这样：{ "23": "Y", "25": "N" }

                    // 遍历我的账本，见缝插针地修改颜色
                    for (const [ansId, isLike] of Object.entries(feedbacks)) {
                        applyFeedbackState(ansId, isLike);
                    }
                } else if (response.status === 401) {
                    redirectToLogin('登录状态已失效，请重新登录。');
                }
            } catch (error) {
                console.error("拉取点赞状态失败", error);
            }
        }

        async function recordBrowseHistory(questionId) {
            if (browseHistoryRecorded) {
                return;
            }

            const token = sessionStorage.getItem('access_token');
            const userId = getCurrentUserId();
            if (!token || !userId || !questionId) {
                return;
            }

            browseHistoryRecorded = true;
            const duration = Math.max(0, Math.round((Date.now() - detailOpenedAt) / 1000));

            try {
                await fetch(buildApiUrl(`/api/questions/${questionId}/browse`), {
                    method: 'POST',
                    keepalive: true,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        duration,
                        click_depth: 1
                    })
                });
            } catch (error) {
                console.error("记录浏览历史失败:", error);
                browseHistoryRecorded = false;
            }
        }

        window.addEventListener('pagehide', () => {
            const questionId = getCurrentQuestionId();
            if (questionId) {
                recordBrowseHistory(questionId);
            }
        });

    </script>
