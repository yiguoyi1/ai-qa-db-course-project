<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 问答社区 - 登录与注册</title>
  <style>
    /* 极简现代的全局配置 */
    :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f3f4f6;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-main: #111827;
        --text-muted: #6b7280;
        --border-color: #e5e7eb;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: var(--text-main);
    }

    /* 优雅的卡片设计 */
    .auth-container {
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        padding: 48px 40px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 380px;
        transition: all 0.3s ease;
    }

    .header {
        text-align: center;
        margin-bottom: 32px;
    }

    .header h1 {
        font-size: 28px;
        margin: 0 0 8px 0;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 14px;
    }

    /* 输入框的现代感设计 */
    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
    }

    .input-group input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        background: #f9fafb;
        font-size: 15px;
        box-sizing: border-box;
        transition: all 0.2s;
    }

    .input-group input:focus {
        outline: none;
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* 按钮设计 */
    .btn-primary {
        width: 100%;
        padding: 14px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        margin-top: 10px;
    }

    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-primary:active { transform: scale(0.98); }

    .action-links {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
        color: var(--text-muted);
    }

    .action-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
    }

    .action-links a:hover { text-decoration: underline; }

    /* 提示信息框 */
    #result-message {
        margin-top: 20px;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        display: none;
        line-height: 1.5;
        word-break: break-all;
    }
    .success { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    /* 隐藏元素的类 */
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="header">
    <h1 id="form-title">欢迎回来</h1>
    <p id="form-subtitle">登录你的 AI 问答社区账号</p>
  </div>

  <div id="login-section">
    <div class="input-group">
      <label>用户名</label>
      <input type="text" id="login-username" placeholder="请输入用户名" required>
    </div>
    <div class="input-group">
      <label>密码</label>
      <input type="password" id="login-password" placeholder="请输入密码" required>
    </div>
    <button class="btn-primary" onclick="handleLogin()">登 录</button>
    <div class="action-links">
      没有账号？ <a onclick="toggleForm('register')">立即注册</a>
    </div>
  </div>

  <div id="register-section" class="hidden">
    <div class="input-group">
      <label>设置用户名</label>
      <input type="text" id="reg-username" placeholder="建议使用英文字母和数字" required>
    </div>
    <div class="input-group">
      <label>设置密码</label>
      <input type="password" id="reg-password" placeholder="至少 6 位字符" required>
    </div>
    <div class="input-group">
      <label>社区昵称 (可选)</label>
      <input type="text" id="reg-nickname" placeholder="让大家怎么称呼你？">
    </div>
    <button class="btn-primary" onclick="handleRegister()">注 册</button>
    <div class="action-links">
      已有账号？ <a onclick="toggleForm('login')">返回登录</a>
    </div>
  </div>

  <div id="result-message"></div>
</div>

<script>
  const HOME_PAGE_URL = '/home';

  function buildApiUrl(path) {
      return new URL(path, window.location.origin).toString();
  }

  // 切换登录/注册表单的 UI 逻辑
  function toggleForm(type) {
      const title = document.getElementById('form-title');
      const subtitle = document.getElementById('form-subtitle');
      const resultDiv = document.getElementById('result-message');

      // 每次切换时清空提示信息
      resultDiv.style.display = 'none';

      // 🌟 新增优化：每次切换表单时，强制清空所有输入框，保护隐私安全 🌟
      document.getElementById('login-username').value = '';
      document.getElementById('login-password').value = '';
      document.getElementById('reg-username').value = '';
      document.getElementById('reg-password').value = '';
      document.getElementById('reg-nickname').value = '';

      if (type === 'register') {
          document.getElementById('login-section').classList.add('hidden');
          document.getElementById('register-section').classList.remove('hidden');
          title.innerText = '创建账号';
          subtitle.innerText = '加入 AI 问答社区，开启探索之旅';
      } else {
          document.getElementById('register-section').classList.add('hidden');
          document.getElementById('login-section').classList.remove('hidden');
          title.innerText = '欢迎回来';
          subtitle.innerText = '登录你的 AI 问答社区账号';
      }
  }

  // 辅助函数：展示提示信息
  function showMessage(msg, isSuccess) {
      const resultDiv = document.getElementById('result-message');
      resultDiv.style.display = 'block';
      resultDiv.className = isSuccess ? 'success' : 'error';
      resultDiv.innerHTML = msg;
  }

  // 处理登录请求 (对接后端 API)
  async function handleLogin() {
      const user = document.getElementById('login-username').value;
      const pass = document.getElementById('login-password').value;

      if (!user || !pass) return showMessage('❌ 用户名和密码不能为空', false);
      showMessage('⏳ 正在验证登录信息...', true);

      try {
          const response = await fetch(buildApiUrl('/api/auth/login'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: user, password: pass })
          });
          const data = await response.json();

          if (response.ok) {
                showMessage(`✅ 登录成功！正在进入社区...`, true);

                // 🌟 关键操作：把房卡存进浏览器的保险箱 🌟
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('username', data.username);
                localStorage.setItem('user_role', data.role);

                // 🌟 跳转大招：延迟 0.5 秒后（让用户看清成功提示），跳入大厅 🌟
                setTimeout(() => {
                    window.location.href = HOME_PAGE_URL;
                }, 500);

            } else {
              showMessage(`❌ 登录失败: ${data.detail || '账号或密码错误'}`, false);
          }
      } catch (error) {
          showMessage(`❌ 网络请求失败，请确认后端服务已经启动。`, false);
      }
  }

  // 处理注册请求 (对接后端 API)
  async function handleRegister() {
      const user = document.getElementById('reg-username').value;
      const pass = document.getElementById('reg-password').value;
      const nick = document.getElementById('reg-nickname').value;

      if (!user || !pass) return showMessage('❌ 用户名和密码不能为空', false);
      showMessage('⏳ 正在为您创建账号...', true);

      try {
          const response = await fetch(buildApiUrl('/api/auth/register'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: user, password: pass, nickname: nick })
          });
          const data = await response.json();

          if (response.ok) {
              showMessage(`✅ 注册成功！请点击下方“返回登录”进行登录。`, true);
          } else {
              showMessage(`❌ 注册失败: ${data.detail || '用户名可能已被占用'}`, false);
          }
      } catch (error) {
          showMessage(`❌ 网络请求失败，请确认后端服务已经启动。`, false);
      }
  }
</script>

</body>
</html>
