<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 问答社区 - 登录与注册</title>
  <style>
    /* 极简现代的全局配置 */
    :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f3f4f6;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-main: #111827;
        --text-muted: #6b7280;
        --border-color: #e5e7eb;
        --shadow-md: 0 24px 60px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background:
            radial-gradient(circle at top left, rgba(191, 219, 254, 0.9), transparent 34%),
            linear-gradient(180deg, #eef4ff 0%, #f8fafc 48%, #f3f4f6 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 28px;
        color: var(--text-main);
    }

    /* 优雅的卡片设计 */
    .auth-container {
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        padding: 46px 42px;
        border-radius: 18px;
        box-shadow: var(--shadow-md);
        border: 1px solid rgba(226, 232, 240, 0.9);
        width: 100%;
        max-width: 420px;
        transition: all 0.3s ease;
    }

    .header {
        text-align: center;
        margin-bottom: 34px;
    }

    .header h1 {
        font-size: 30px;
        margin: 0 0 8px 0;
        font-weight: 800;
        letter-spacing: -0.01em;
    }

    .header p {
        margin: 0;
        color: var(--text-muted);
        font-size: 14px;
    }

    /* 输入框的现代感设计 */
    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
    }

    .input-group input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background: #f9fafb;
        font-size: 15px;
        transition: all 0.2s;
    }

    .input-group input:focus {
        outline: none;
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* 按钮设计 */
    .btn-primary {
        width: 100%;
        padding: 14px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        margin-top: 10px;
    }

    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-primary:active { transform: scale(0.98); }

    .action-links {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
        color: var(--text-muted);
    }

    .action-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
    }

    .action-links a:hover { text-decoration: underline; }

    /* 提示信息框 */
    #result-message {
        margin-top: 20px;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        display: none;
        line-height: 1.5;
        word-break: break-all;
    }
    .success { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    /* 隐藏元素的类 */
    .hidden { display: none; }

    @media (max-width: 520px) {
        body {
            padding: 18px;
            align-items: flex-start;
        }

        .auth-container {
            margin-top: 32px;
            padding: 34px 24px;
        }

        .header h1 {
            font-size: 26px;
        }
    }

    /* Enterprise UI refinement layer: stronger first-impression branding, no auth logic changes. */
    :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --surface-glass: rgba(255, 255, 255, 0.9);
        --border-color: #dbe3ef;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --shadow-md: 0 34px 90px rgba(15, 23, 42, 0.16);
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        position: relative;
        overflow-x: hidden;
        background:
            radial-gradient(circle at 12% 8%, rgba(59, 130, 246, 0.22), transparent 30%),
            radial-gradient(circle at 88% 12%, rgba(14, 165, 233, 0.16), transparent 28%),
            linear-gradient(180deg, #f3f7ff 0%, #f8fbff 48%, #f4f7fb 100%);
        -webkit-font-smoothing: antialiased;
    }

    body::before {
        content: "AI QA";
        position: fixed;
        left: clamp(24px, 6vw, 80px);
        top: clamp(20px, 6vh, 70px);
        color: rgba(37, 99, 235, 0.08);
        font-size: clamp(46px, 10vw, 132px);
        font-weight: 900;
        letter-spacing: -0.08em;
        pointer-events: none;
    }

    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(37, 99, 235, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(37, 99, 235, 0.04) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.52), transparent 62%);
    }

    .auth-container {
        position: relative;
        z-index: 1;
        max-width: 440px;
        border-radius: 28px;
        background: var(--surface-glass);
        border: 1px solid rgba(219, 227, 239, 0.94);
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(18px);
        overflow: hidden;
    }

    .auth-container::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 5px;
        background: linear-gradient(90deg, #2563eb, #38bdf8);
    }

    .home-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 12px;
        margin-bottom: 22px;
        border: 1px solid #dbeafe;
        border-radius: 999px;
        background: #f8fbff;
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .home-link:hover {
        background: #eff6ff;
        border-color: #bfdbfe;
        transform: translateY(-1px);
    }

    .header h1 {
        color: #0f172a;
        letter-spacing: -0.05em;
    }

    .header p {
        color: #64748b;
    }

    .input-group label {
        color: #475569;
        font-weight: 750;
    }

    .input-group input {
        min-height: 48px;
        border-color: #dbe3ef;
        background: rgba(248, 250, 252, 0.94);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.86);
    }

    .input-group input:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.11);
    }

    .btn-primary {
        min-height: 50px;
        border-radius: 14px;
        background: linear-gradient(135deg, #2563eb 0%, #3b82f6 62%, #38bdf8 100%);
        box-shadow: 0 16px 32px rgba(37, 99, 235, 0.24);
    }

    .btn-primary:hover {
        background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 62%, #0ea5e9 100%);
        box-shadow: 0 20px 38px rgba(37, 99, 235, 0.3);
    }

    .action-links a {
        font-weight: 800;
    }

    #result-message {
        border-radius: 16px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }

    @media (max-width: 520px) {
        .auth-container {
            border-radius: 22px;
        }
    }
  </style>
</head>
<body>

<div class="auth-container">
  <button class="home-link" type="button" onclick="goHome()">← 返回社区首页</button>

  <div class="header">
    <h1 id="form-title">欢迎回来</h1>
    <p id="form-subtitle">登录你的 AI 问答社区账号</p>
  </div>

  <div id="login-section">
    <div class="input-group">
      <label>用户名</label>
      <input type="text" id="login-username" placeholder="请输入用户名" required>
    </div>
    <div class="input-group">
      <label>密码</label>
      <input type="password" id="login-password" placeholder="请输入密码" required>
    </div>
    <button class="btn-primary" onclick="handleLogin()">登 录</button>
    <div class="action-links">
      没有账号？ <a onclick="toggleForm('register')">立即注册</a>
    </div>
  </div>

  <div id="register-section" class="hidden">
    <div class="input-group">
      <label>设置用户名</label>
      <input type="text" id="reg-username" placeholder="建议使用英文字母和数字" required>
    </div>
    <div class="input-group">
      <label>设置密码</label>
      <input type="password" id="reg-password" placeholder="至少 6 位字符" required>
    </div>
    <div class="input-group">
      <label>社区昵称 (可选)</label>
      <input type="text" id="reg-nickname" placeholder="让大家怎么称呼你？">
    </div>
    <button class="btn-primary" onclick="handleRegister()">注 册</button>
    <div class="action-links">
      已有账号？ <a onclick="toggleForm('login')">返回登录</a>
    </div>
  </div>

  <div id="result-message"></div>
</div>

<script>
  const HOME_PAGE_URL = '/home';

  function buildApiUrl(path) {
      return new URL(path, window.location.origin).toString();
  }

  function goHome() {
      window.location.href = HOME_PAGE_URL;
  }

  // 切换登录/注册表单的 UI 逻辑
  function toggleForm(type) {
      const title = document.getElementById('form-title');
      const subtitle = document.getElementById('form-subtitle');
      const resultDiv = document.getElementById('result-message');

      // 每次切换时清空提示信息
      resultDiv.style.display = 'none';

      // 🌟 新增优化：每次切换表单时，强制清空所有输入框，保护隐私安全 🌟
      document.getElementById('login-username').value = '';
      document.getElementById('login-password').value = '';
      document.getElementById('reg-username').value = '';
      document.getElementById('reg-password').value = '';
      document.getElementById('reg-nickname').value = '';

      if (type === 'register') {
          document.getElementById('login-section').classList.add('hidden');
          document.getElementById('register-section').classList.remove('hidden');
          title.innerText = '创建账号';
          subtitle.innerText = '加入 AI 问答社区，开启探索之旅';
      } else {
          document.getElementById('register-section').classList.add('hidden');
          document.getElementById('login-section').classList.remove('hidden');
          title.innerText = '欢迎回来';
          subtitle.innerText = '登录你的 AI 问答社区账号';
      }
  }

  // 辅助函数：展示提示信息
  function showMessage(msg, isSuccess) {
      const resultDiv = document.getElementById('result-message');
      resultDiv.style.display = 'block';
      resultDiv.className = isSuccess ? 'success' : 'error';
      resultDiv.textContent = msg;
  }

  async function readResponsePayload(response) {
      const contentType = response.headers.get('content-type') || '';

      try {
          if (contentType.includes('application/json')) {
              return await response.json();
          }

          const text = await response.text();
          return { detail: text };
      } catch (error) {
          return {};
      }
  }

  function extractErrorDetail(data) {
      if (!data) return '';
      if (typeof data.detail === 'string') return data.detail.trim();
      if (typeof data.message === 'string') return data.message.trim();
      if (Array.isArray(data.detail)) {
          return data.detail
              .map((item) => item?.msg || item?.message || '')
              .filter(Boolean)
              .join('；');
      }
      return '';
  }

  function getFriendlyLoginError(response, data) {
      const detail = extractErrorDetail(data);

      if (detail.includes('用户名或密码')) {
          return '❌ 用户名或密码不正确，请检查后重试。';
      }
      if (detail.includes('锁定') || response.status === 423) {
          return '❌ 账号已被锁定，请联系管理员处理。';
      }
      if (detail.includes('停用')) {
          return '❌ 账号已停用，暂时无法登录。';
      }
      if (detail.includes('未激活') || detail.includes('暂不可用')) {
          return '❌ 账号暂不可用，请联系管理员确认账号状态。';
      }
      if (response.status === 422) {
          return '❌ 请检查用户名和密码格式后再试。';
      }
      if (response.status >= 500) {
          return '❌ 服务暂时异常，请稍后重试或联系管理员。';
      }

      return detail ? `❌ ${detail}` : '❌ 登录没有成功，请检查用户名和密码后重试。';
  }

  function showNetworkError() {
      showMessage('❌ 暂时无法连接到服务，请确认后端已经启动后再试。', false);
  }

  // 处理登录请求 (对接后端 API)
  async function handleLogin() {
      const user = document.getElementById('login-username').value;
      const pass = document.getElementById('login-password').value;

      if (!user || !pass) return showMessage('❌ 用户名和密码不能为空', false);
      showMessage('⏳ 正在验证登录信息...', true);

      try {
          const response = await fetch(buildApiUrl('/api/auth/login'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: user, password: pass })
          });
          const data = await readResponsePayload(response);

          if (response.ok) {
                showMessage(`✅ 登录成功！正在进入社区...`, true);

                // 🌟 关键操作：把登录态保存在当前标签页，避免多个账号互相覆盖 🌟
                sessionStorage.setItem('access_token', data.access_token);
                sessionStorage.setItem('user_id', data.user_id);
                sessionStorage.setItem('username', data.username);
                sessionStorage.setItem('user_role', data.role);

                // 🌟 跳转大招：延迟 0.5 秒后（让用户看清成功提示），跳入大厅 🌟
                setTimeout(() => {
                    window.location.href = HOME_PAGE_URL;
                }, 500);

            } else {
              showMessage(getFriendlyLoginError(response, data), false);
              document.getElementById('login-password').focus();
          }
      } catch (error) {
          showNetworkError();
      }
  }

  // 处理注册请求 (对接后端 API)
  async function handleRegister() {
      const user = document.getElementById('reg-username').value;
      const pass = document.getElementById('reg-password').value;
      const nick = document.getElementById('reg-nickname').value;

      if (!user || !pass) return showMessage('❌ 用户名和密码不能为空', false);
      showMessage('⏳ 正在为您创建账号...', true);

      try {
          const response = await fetch(buildApiUrl('/api/auth/register'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: user, password: pass, nickname: nick })
          });
          const data = await readResponsePayload(response);

          if (response.ok) {
              showMessage(`✅ 注册成功！请点击下方“返回登录”进行登录。`, true);
          } else {
              const detail = extractErrorDetail(data);
              showMessage(`❌ ${detail || '注册没有成功，请检查用户名和密码后重试。'}`, false);
          }
      } catch (error) {
          showNetworkError();
      }
  }
</script>

</body>
</html>
