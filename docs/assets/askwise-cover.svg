    <text x="58" y="220" fill="#1F5361" font-size="27" font-weight="600">问知社区</text>
    <text x="58" y="262" fill="#526779" font-size="18">Community knowledge. AI assistance. Built on data.</text>
    <path d="M58 293H664" stroke="#D0DDE2"/>
    <text x="58" y="329" fill="#183C53" font-size="16" font-weight="600">ORACLE 26ai</text>
    <circle cx="202" cy="323" r="2" fill="#8DA3AE"/>
