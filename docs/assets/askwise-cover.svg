    <text x="818" y="112" fill="#16334E" font-size="18" font-weight="600">A good question starts it.</text>
    <rect x="818" y="127" width="183" height="6" rx="3" fill="#E1EAF1"/>
    <rect x="818" y="141" width="133" height="6" rx="3" fill="#EAF0F5"/>
    <rect x="849" y="192" width="358" height="100" rx="16" fill="#184E4D"/>
