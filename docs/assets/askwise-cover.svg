    <circle cx="304" cy="323" r="2" fill="#8DA3AE"/>
    <text x="322" y="329" fill="#183C53" font-size="16" font-weight="600">DeepSeek</text>
    <circle cx="424" cy="323" r="2" fill="#8DA3AE"/>
    <text x="442" y="329" fill="#183C53" font-size="16" font-weight="600">Web + Desktop</text>
    <text x="58" y="377" fill="#748994" font-size="12" letter-spacing="2">ASK / ANSWER / DISCOVER</text>
    <path d="M795 166V231Q795 245 809 245H930M1055 190V271" stroke="#8BB4B0" stroke-width="2" stroke-dasharray="5 6"/>
