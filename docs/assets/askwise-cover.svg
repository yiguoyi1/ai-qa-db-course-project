<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">AskWise Community - Database Course Project</title>
  <desc id="description">A question-and-answer community built with Oracle, FastAPI and DeepSeek. Community answers, AI assistance and interest-based discovery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#EDF8F5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#2D6581" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#background)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <rect x="56" y="54" width="6" height="24" rx="3" fill="#207666"/>
