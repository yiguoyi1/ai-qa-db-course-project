[package]
name = "ai-qa-desktop"
version = "0.1.0"
description = "Desktop client shell for the AI QA community."
authors = ["AI QA Community"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_qa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai-qa-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
