<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI QA Community</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --line: #d8e1ef;
      --text: #102033;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --shadow: 0 18px 55px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.10), transparent 34%),
        linear-gradient(225deg, rgba(14, 165, 233, 0.10), transparent 38%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .shell {
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
      background: var(--panel);
      border: 1px solid rgba(216, 225, 239, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .brand-panel {
      padding: 44px;
      background:
        linear-gradient(160deg, rgba(37, 99, 235, 0.10), rgba(14, 165, 233, 0.06)),
        #f8fbff;
      border-right: 1px solid var(--line);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0;
      margin-bottom: 42px;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #0891b2);
      font-weight: 900;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 36px;
      line-height: 1.16;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 40px;
    }

    .metric {
      padding: 16px;
      border: 1px solid rgba(216, 225, 239, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
    }

    .metric strong {
      display: block;
      font-size: 20px;
      margin-bottom: 6px;
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
    }

    .control-panel {
      padding: 44px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      background: #ffffff;
    }

    .status-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--warning);
      box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.12);
    }

    .dot.ok {
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.12);
    }

    .dot.fail {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
    }

    .status-text {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    label {
      display: block;
      color: #334155;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 13px;
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      height: 44px;
      border: 1px solid transparent;
      border-radius: 8px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.68;
      transform: none;
      box-shadow: none;
    }

    .primary {
      color: #ffffff;
      background: var(--primary);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.24);
    }

    .primary:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .secondary {
      color: #1e293b;
      background: #ffffff;
      border-color: var(--line);
    }

    .secondary:hover:not(:disabled) {
      background: #f8fafc;
      transform: translateY(-1px);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 13px;
    }

    code {
      color: #1e40af;
      background: #eef4ff;
      border: 1px solid #dbeafe;
      border-radius: 6px;
      padding: 2px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
    }

    @media (max-width: 820px) {
      body {
        padding: 18px;
      }

      .shell {
        grid-template-columns: 1fr;
      }

      .brand-panel {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 30px;
      }

      .control-panel {
        padding: 30px;
      }

      h1 {
        font-size: 28px;
      }

      .metric-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="brand-panel" aria-label="产品信息">
      <div class="logo">
        <span class="logo-mark">AI</span>
        <span>AI QA Community</span>
      </div>
      <h1>企业级 AI 知识社区桌面端</h1>
      <p class="lead">
        桌面客户端默认连接公网 FastAPI 服务，复用服务器上的 Web 前端与 Oracle 数据库，提供独立窗口和固定入口。
      </p>
      <div class="metric-row" aria-label="客户端能力">
        <div class="metric">
          <strong>Web</strong>
          <span>完整复用现有页面</span>
        </div>
        <div class="metric">
          <strong>API</strong>
          <span>连接服务器 FastAPI</span>
        </div>
        <div class="metric">
          <strong>Tauri</strong>
          <span>轻量桌面壳</span>
        </div>
      </div>
    </section>

    <section class="control-panel" aria-label="连接控制">
      <div class="status">
        <div class="status-title">
          <span class="dot" id="status-dot"></span>
          <span id="status-title">正在检查后端服务</span>
        </div>
        <p class="status-text" id="status-text">正在连接 FastAPI，请稍候。</p>
      </div>

      <div>
        <label for="backend-url">后端地址</label>
        <input id="backend-url" type="url" value="http://120.55.74.107" spellcheck="false">
      </div>

      <div class="actions">
        <button class="primary" id="enter-button" type="button" disabled>进入社区</button>
        <button class="secondary" id="retry-button" type="button">重新检测</button>
      </div>

      <p class="hint">
        默认连接服务器数据；本地开发时可改为 <code>http://127.0.0.1:8000</code>。
      </p>
    </section>
  </main>

  <script>
    const DEFAULT_BACKEND_URL = 'http://120.55.74.107';
    const LEGACY_LOCAL_BACKEND_URLS = new Set(['http://127.0.0.1:8000', 'http://localhost:8000']);
    const COMMUNITY_ENTRY_PATH = '/home';
    const BACKEND_STORAGE_KEY = 'aiqa.desktop.backendUrl';
    const input = document.getElementById('backend-url');
    const statusDot = document.getElementById('status-dot');
    const statusTitle = document.getElementById('status-title');
    const statusText = document.getElementById('status-text');
    const enterButton = document.getElementById('enter-button');
    const retryButton = document.getElementById('retry-button');

    function normalizeBackendUrl(value) {
      return String(value || DEFAULT_BACKEND_URL).trim().replace(/\/+$/, '');
    }

    function getInitialBackendUrl() {
      const storedUrl = normalizeBackendUrl(localStorage.getItem(BACKEND_STORAGE_KEY));
      if (!storedUrl || LEGACY_LOCAL_BACKEND_URLS.has(storedUrl)) {
        localStorage.setItem(BACKEND_STORAGE_KEY, DEFAULT_BACKEND_URL);
        return DEFAULT_BACKEND_URL;
      }
      return storedUrl;
    }

    function setStatus(type, title, text) {
      statusDot.className = `dot ${type}`;
      statusTitle.textContent = title;
      statusText.textContent = text;
      enterButton.disabled = type !== 'ok';
    }

    function getBackendUrl() {
      const url = normalizeBackendUrl(input.value);
      input.value = url;
      localStorage.setItem(BACKEND_STORAGE_KEY, url);
      return url;
    }

    function buildCommunityEntryUrl(backendUrl = getBackendUrl()) {
      return `${normalizeBackendUrl(backendUrl)}${COMMUNITY_ENTRY_PATH}`;
    }

    async function fetchBackendHealth(backendUrl) {
      try {
        const response = await fetch(`${backendUrl}/health`, {
          method: 'GET',
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        return { corsLimited: false };
      } catch (error) {
        if (!(error instanceof TypeError)) {
          throw error;
        }

        await fetch(`${backendUrl}/health`, {
          method: 'GET',
          cache: 'no-store',
          mode: 'no-cors'
        });

        return { corsLimited: true };
      }
    }

    async function checkBackend({ autoEnter = false } = {}) {
      const backendUrl = getBackendUrl();
      setStatus('', '正在检查后端服务', `正在连接 ${backendUrl}/health`);

      try {
        const { corsLimited } = await fetchBackendHealth(backendUrl);
        const statusMessage = corsLimited
          ? '服务器已响应，浏览器跨域限制会在进入同源社区页面后消失。'
          : 'FastAPI 已就绪，可以进入 AI QA 社区首页。';

        setStatus('ok', '后端服务已连接', statusMessage);

        if (autoEnter) {
          window.setTimeout(() => {
            window.location.href = buildCommunityEntryUrl(backendUrl);
          }, 450);
        }
      } catch (error) {
        setStatus('fail', '暂时无法连接后端', `请确认 FastAPI 正在运行，然后重新检测。错误：${error.message}`);
      }
    }

    enterButton.addEventListener('click', () => {
      window.location.href = buildCommunityEntryUrl();
    });

    retryButton.addEventListener('click', () => {
      checkBackend();
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        checkBackend();
      }
    });

    input.value = getInitialBackendUrl();
    checkBackend({ autoEnter: true });
  </script>
</body>
</html>
